# Render Blueprint — 저장소 루트 기준 (수동 Web Service도 동일하게 맞출 것)
services:
  - type: web
    name: thejohn
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: thejhon
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: THEJHON_ADMIN_PASSWORD
        sync: false
      - key: THEJHON_GUEST_PASSWORD
        value: guest
      - key: ALLOWED_ORIGINS
        value: https://thejohn.onrender.com,https://thejohn.co.kr,https://www.thejohn.co.kr,http://localhost:3000
