<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>그룹 마케팅 관리 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="work-hub.css">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar company-main company-main--support-hub company-main--work-hub">
        <div class="wh-hub-head">
            <h1>그룹 마케팅 관리</h1>
            <p id="wh-status" class="shub-status" role="status" aria-live="polite"></p>
        </div>

        <div class="wh-hub-shell">
            <section class="wh-hub-video-wrap" aria-label="소개 영상">
                <video
                    class="wh-hub-video"
                    id="whHubVideo"
                    src="img/hub_intro.mp4"
                    playsinline
                    autoplay
                    loop
                    muted
                    controls
                    preload="auto"
                    poster=""
                >
                    브라우저가 동영상을 지원하지 않습니다.
                </video>
            </section>

            <section class="wh-hub-menus" aria-label="업무 메뉴">
                <div class="company-divisions wh-hub-rows">
                    <div class="wh-hub-row">
                        <a href="index.html" class="company-division-card wh-hub-card" id="wh-menu-view-home" data-wh-menu="view-home">
                            <h2>홈페이지</h2>
                        </a>
                        <a href="homepage-manage-hub.html" class="company-division-card wh-hub-card" id="wh-menu-manage-home" data-wh-menu="manage-home">
                            <h2>홈페이지 관리하기</h2>
                        </a>
                    </div>
                    <div class="wh-hub-row">
                        <a href="product-manage.html" class="company-division-card wh-hub-card" id="wh-menu-product-manage" data-wh-menu="product-manage" hidden>
                            <h2>상품관리</h2>
                        </a>
                        <a href="vendor-manage.html" class="company-division-card wh-hub-card" id="wh-menu-vendor-manage" data-wh-menu="vendor-manage" hidden>
                            <h2>업체관리</h2>
                        </a>
                    </div>
                    <div class="wh-hub-row">
                        <a href="supervisor-order-list.html" class="company-division-card wh-hub-card" id="wh-menu-order-manage" data-wh-menu="order-manage" hidden>
                            <h2>발주서 관리</h2>
                        </a>
                        <a href="staff-manage-hub.html" class="company-division-card wh-hub-card" id="wh-menu-work-manage" data-wh-menu="work-manage" hidden>
                            <h2>업무관리</h2>
                        </a>
                    </div>
                </div>
            </section>

            <div class="wh-hub-audio-bar">
                <button type="button" class="wh-hub-music-btn" id="whMusicToggle" aria-pressed="false" aria-label="배경음악 켜기" title="배경음악">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <span id="whMusicToggleLabel">배경음악 켜기</span>
                </button>
                <audio id="whHubMusic" src="img/hub_music.mp3" loop preload="auto" aria-label="허브 배경음악"></audio>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script src="work-hub.js"></script>
</body>
</html>
