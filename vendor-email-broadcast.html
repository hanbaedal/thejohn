<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>업체별 이메일 보내기 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="admin-manage.css">
    <style>
        .veb-source {
            margin-bottom: 1rem;
            padding: 0.85rem 1rem;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 10px;
        }
        .veb-source-title {
            margin: 0 0 0.65rem;
            font-size: 0.95rem;
            font-weight: 700;
            color: #052a4d;
        }
        .veb-source-options {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            margin-bottom: 0.75rem;
        }
        .veb-source-options label {
            display: flex;
            align-items: flex-start;
            gap: 0.45rem;
            font-size: 0.9rem;
            color: #2a4560;
            cursor: pointer;
        }
        .veb-source-options small {
            display: block;
            margin-top: 0.15rem;
            font-size: 0.8rem;
            color: #5a6d7e;
            font-weight: 400;
        }
        .veb-source-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }
        .veb-selected-summary {
            margin: 0.55rem 0 0;
            font-size: 0.86rem;
            color: #3d5166;
        }
        .veb-row { margin-top: 0.5rem; }
        .veb-subject { min-width: 26rem; max-width: 100%; }
        .veb-textarea { width: 100%; max-width: 58rem; }
        .veb-test-email { min-width: 22rem; max-width: 100%; }
        .veb-history {
            margin-top: 1rem;
            border-top: 1px dashed #d5deea;
            padding-top: 0.9rem;
        }
        .veb-history-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 19rem;
            overflow-y: auto;
            padding-right: 0.2rem;
        }
        .veb-history-list li {
            border: 1px solid #e7edf4;
            border-radius: 8px;
            padding: 0.55rem 0.7rem;
            margin-bottom: 0.45rem;
            background: #fff;
            font-size: 0.86rem;
            color: #3b4f62;
        }
        .veb-history-title { margin: 0; }
        .veb-date-input { min-width: 10rem; }
        .veb-picker-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(5, 42, 77, 0.45);
        }
        .veb-picker-modal[hidden] { display: none !important; }
        .veb-picker-panel {
            width: 100%;
            max-height: min(92vh, 40rem);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 14px 14px 0 0;
            box-shadow: 0 -8px 32px rgba(10, 77, 156, 0.22);
        }
        @media (min-width: 721px) {
            .veb-picker-modal { align-items: center; padding: 1rem; }
            .veb-picker-panel {
                width: min(100%, 52rem);
                border-radius: 14px;
                max-height: min(90vh, 40rem);
            }
        }
        .veb-picker-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #e7edf4;
        }
        .veb-picker-head h2 {
            margin: 0;
            font-size: 1.05rem;
            color: #052a4d;
        }
        .veb-picker-bulk {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            padding: 0.65rem 1rem;
            border-bottom: 1px solid #eef2f7;
            background: #f8fbff;
        }
        .veb-picker-bulk .btn {
            font-size: 0.8rem;
            padding: 0.35rem 0.65rem;
        }
        .veb-picker-scroll {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 0.5rem 0.75rem 0.75rem;
        }
        .veb-picker-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.84rem;
        }
        .veb-picker-table th,
        .veb-picker-table td {
            padding: 0.45rem 0.35rem;
            border-bottom: 1px solid #eef2f7;
            text-align: left;
            vertical-align: middle;
        }
        .veb-picker-table th {
            font-size: 0.78rem;
            color: #5a6d7e;
            font-weight: 600;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 1;
        }
        .veb-picker-table .veb-col-check {
            width: 3.5rem;
            text-align: center;
        }
        .veb-picker-table .veb-col-name {
            min-width: 7rem;
            font-weight: 600;
            color: #052a4d;
        }
        .veb-picker-email {
            display: block;
            font-size: 0.75rem;
            color: #6a7d90;
            margin-top: 0.1rem;
            word-break: break-all;
        }
        .veb-picker-email--empty { color: #a8b5c4; font-style: italic; }
        .veb-picker-check[disabled] + span,
        .veb-picker-check:disabled { opacity: 0.45; cursor: not-allowed; }
        .veb-picker-foot {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: flex-end;
            padding: 0.75rem 1rem 1rem;
            border-top: 1px solid #e7edf4;
        }
        .veb-picker-empty {
            margin: 1rem 0;
            text-align: center;
            color: #5a6d7e;
            font-size: 0.9rem;
        }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="staff-vendor-boot.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--vendor" aria-label="업체관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar">
        <p class="am-subnav"><a href="vendor-manage.html">← 업체관리</a></p>
        <h1>업체별 이메일 보내기</h1>
        <p id="veb-status" class="vl-status" role="status" aria-live="polite"></p>

        <section class="veb-source">
            <p class="veb-source-title">발송 대상 업체 종류</p>
            <div class="veb-source-options" role="radiogroup" aria-label="발송 대상 업체 종류">
                <label>
                    <input type="radio" name="veb-source" value="vendors" checked>
                    <span>등록업체 (vendors)<small>거래하고 있는 등록업체</small></span>
                </label>
                <label>
                    <input type="radio" name="veb-source" value="vendor_new">
                    <span>신규업체 (vendor_new)<small>새롭게 마케팅하는 업체</small></span>
                </label>
            </div>
            <label><input type="checkbox" id="veb-only-mine" checked> 내가 등록한 업체만</label>
            <div class="veb-source-actions">
                <button type="button" class="btn btn-primary" id="veb-pick-btn">수신자 선택</button>
            </div>
            <p id="veb-selected-summary" class="veb-selected-summary">수신자를 선택해 주세요.</p>
        </section>

        <section class="vei-panel">
            <div class="vei-file-row veb-row">
                <label for="veb-subject">제목</label>
                <input type="text" id="veb-subject" class="veb-subject" placeholder="안녕하세요. 공지드립니다.">
            </div>
            <div class="veb-row">
                <label for="veb-greeting">인사말/본문</label>
                <textarea id="veb-greeting" class="veb-textarea" rows="10"></textarea>
            </div>
            <div class="veb-row">
                <label for="veb-files">첨부서류</label>
                <input type="file" id="veb-files" multiple>
                <p class="vei-hint">간단형 기능: 최대 5개 파일, 파일당 4MB 권장</p>
            </div>
            <div class="vei-actions">
                <input type="email" id="veb-test-email" class="veb-test-email" placeholder="테스트 수신 이메일">
                <button type="button" class="btn" id="veb-test-btn">테스트 발송</button>
                <button type="button" class="btn btn-primary" id="veb-send-btn">메일 보내기</button>
            </div>
            <div id="veb-failed-wrap" class="veb-history" hidden>
                <h3>실패 주소 리포트</h3>
                <ul id="veb-failed-list" class="veb-history-list"></ul>
            </div>
            <div class="veb-history">
                <div class="vei-actions">
                    <h3 class="veb-history-title">발송 이력</h3>
                    <label for="veb-history-date-from" class="sr-only">발송이력 시작일</label>
                    <input type="date" id="veb-history-date-from" class="veb-date-input">
                    <span>~</span>
                    <label for="veb-history-date-to" class="sr-only">발송이력 종료일</label>
                    <input type="date" id="veb-history-date-to" class="veb-date-input">
                </div>
                <ul id="veb-history-list" class="veb-history-list"></ul>
            </div>
        </section>
    </main>

    <div id="veb-picker-modal" class="veb-picker-modal" hidden role="dialog" aria-modal="true" aria-labelledby="veb-picker-title">
        <div class="veb-picker-panel">
            <div class="veb-picker-head">
                <h2 id="veb-picker-title">수신자 선택</h2>
                <button type="button" class="btn" id="veb-picker-close" aria-label="닫기">닫기</button>
            </div>
            <div class="veb-picker-bulk" aria-label="일괄 선택">
                <button type="button" class="btn" id="veb-bulk-company">회사만 선택</button>
                <button type="button" class="btn" id="veb-bulk-manager">담당자만 선택</button>
                <button type="button" class="btn" id="veb-bulk-both">회사+담당자 선택</button>
                <button type="button" class="btn" id="veb-bulk-clear">선택 해제</button>
            </div>
            <div class="veb-picker-scroll">
                <table class="veb-picker-table" id="veb-picker-table">
                    <thead>
                        <tr>
                            <th class="veb-col-name">업체 이름</th>
                            <th class="veb-col-check">회사 이메일</th>
                            <th class="veb-col-check">담당자 이메일</th>
                        </tr>
                    </thead>
                    <tbody id="veb-picker-body"></tbody>
                </table>
                <p id="veb-picker-empty" class="veb-picker-empty" hidden>표시할 업체가 없습니다.</p>
            </div>
            <div class="veb-picker-foot">
                <button type="button" class="btn" id="veb-picker-cancel">취소</button>
                <button type="button" class="btn btn-primary" id="veb-picker-apply">선택 완료</button>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script src="vendor-email-broadcast.js"></script>
</body>
</html>
