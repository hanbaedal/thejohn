<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <title>업체별 이메일 보내기 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="admin-manage.css">
    <style>
        .veb-compose { max-width: 58rem; width: 100%; }
        .veb-source {
            margin-bottom: 1rem;
            padding: 0.85rem 1rem;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 10px;
        }
        .veb-source-title {
            margin: 0 0 0.65rem;
            font-size: 0.95rem;
            font-weight: 700;
            color: #052a4d;
        }
        .veb-source-options {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 1.5rem;
            margin-bottom: 0.75rem;
        }
        .veb-source-options label {
            display: inline-flex;
            align-items: flex-start;
            gap: 0.4rem;
            font-size: 0.9rem;
            color: #2a4560;
            cursor: pointer;
        }
        .veb-source-options small {
            display: block;
            margin-top: 0.12rem;
            font-size: 0.78rem;
            color: #5a6d7e;
            font-weight: 400;
        }
        .veb-selected-summary {
            margin: 0.55rem 0 0;
            font-size: 0.86rem;
            color: #3d5166;
        }
        .veb-field { margin-bottom: 0.85rem; }
        .veb-field > label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #2a4560;
        }
        .veb-subject {
            display: block;
            width: 100%;
            box-sizing: border-box;
            min-height: 2.65rem;
            padding: 0.55rem 0.5cm;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid #c5d0dc;
            border-radius: 8px;
        }
        .veb-textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            min-height: 15rem;
            padding: 0.5cm;
            font-size: 1rem;
            line-height: 1.55;
            font-family: inherit;
            border: 1px solid #c5d0dc;
            border-radius: 8px;
            resize: vertical;
        }
        .veb-attach-block { margin-top: 1.1rem; }
        .veb-attach-block > label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #2a4560;
        }
        .veb-file-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
        .veb-attach-list {
            list-style: none;
            margin: 0.55rem 0 0;
            padding: 0;
        }
        .veb-attach-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.45rem 0.65rem;
            padding: 0.5rem 0.65rem;
            border: 1px solid #e7edf4;
            border-radius: 8px;
            margin-bottom: 0.4rem;
            background: #fafcfe;
            font-size: 0.86rem;
        }
        .veb-attach-num {
            flex: 0 0 auto;
            font-weight: 700;
            color: #0a4d9c;
            min-width: 1.5rem;
        }
        .veb-attach-name {
            flex: 1 1 12rem;
            min-width: 0;
            word-break: break-all;
            color: #2a4560;
        }
        .veb-attach-actions {
            flex: 0 0 auto;
            display: flex;
            gap: 0.35rem;
        }
        .veb-attach-actions .btn { font-size: 0.8rem; padding: 0.3rem 0.6rem; }
        .veb-send-actions {
            margin-top: 1.1rem;
            display: flex;
            justify-content: flex-end;
        }
        .veb-failed {
            margin-top: 1rem;
            border-top: 1px dashed #d5deea;
            padding-top: 0.9rem;
        }
        .veb-failed-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .veb-failed-list li {
            border: 1px solid #e7edf4;
            border-radius: 8px;
            padding: 0.55rem 0.7rem;
            margin-bottom: 0.45rem;
            background: #fff;
            font-size: 0.86rem;
        }
        .veb-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(5, 42, 77, 0.45);
        }
        .veb-modal[hidden] { display: none !important; }
        .veb-modal__panel {
            width: min(100%, 52rem);
            max-height: min(92vh, 40rem);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(10, 77, 156, 0.22);
        }
        .veb-modal__panel--compact {
            width: min(100%, 24rem);
            max-height: none;
            padding: 1.25rem 1.1rem 1.1rem;
            text-align: center;
        }
        .veb-modal__panel--compact h2 {
            margin: 0 0 0.75rem;
            font-size: 1.05rem;
            color: #052a4d;
        }
        .veb-modal__panel--compact p {
            margin: 0 0 1.1rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #2a4560;
        }
        .veb-modal__actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }
        .veb-picker-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #e7edf4;
        }
        .veb-picker-head h2 { margin: 0; font-size: 1.05rem; color: #052a4d; }
        .veb-picker-bulk {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            padding: 0.65rem 1rem;
            border-bottom: 1px solid #eef2f7;
            background: #f8fbff;
        }
        .veb-picker-bulk .btn { font-size: 0.8rem; padding: 0.35rem 0.65rem; }
        .veb-picker-scroll {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 0.5rem 0.75rem 0.75rem;
        }
        .veb-picker-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.84rem;
        }
        .veb-picker-table th, .veb-picker-table td {
            padding: 0.45rem 0.35rem;
            border-bottom: 1px solid #eef2f7;
            text-align: left;
            vertical-align: middle;
        }
        .veb-picker-table th {
            font-size: 0.78rem;
            color: #5a6d7e;
            font-weight: 600;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 1;
        }
        .veb-picker-table .veb-col-check { width: 3.5rem; text-align: center; }
        .veb-picker-table .veb-col-name { min-width: 7rem; font-weight: 600; color: #052a4d; }
        .veb-picker-table .veb-col-type { width: 4.5rem; font-size: 0.75rem; color: #5a6d7e; }
        .veb-picker-email {
            display: block;
            font-size: 0.75rem;
            color: #6a7d90;
            margin-top: 0.1rem;
            word-break: break-all;
        }
        .veb-picker-email--empty { color: #a8b5c4; font-style: italic; }
        .veb-picker-foot {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: flex-end;
            padding: 0.75rem 1rem 1rem;
            border-top: 1px solid #e7edf4;
        }
        .veb-picker-empty {
            margin: 1rem 0;
            text-align: center;
            color: #5a6d7e;
            font-size: 0.9rem;
        }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="staff-vendor-boot.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--vendor" aria-label="업체관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar">
        <p class="am-subnav"><a href="vendor-manage.html">← 업체관리</a></p>
        <h1>업체별 이메일 보내기</h1>
        <p id="veb-status" class="vl-status" role="status" aria-live="polite"></p>

        <section class="veb-source veb-compose">
            <p class="veb-source-title">발송 대상 업체 분류</p>
            <div class="veb-source-options" aria-label="발송 대상 업체 분류">
                <label>
                    <input type="checkbox" id="veb-src-vendors" value="vendors" checked>
                    <span>등록업체<small>거래하고 있는 등록업체</small></span>
                </label>
                <label>
                    <input type="checkbox" id="veb-src-vendor-new" value="vendor_new" checked>
                    <span>신규업체<small>새롭게 마케팅하는 업체</small></span>
                </label>
            </div>
            <button type="button" class="btn btn-primary" id="veb-pick-btn">수신자 선택</button>
            <p id="veb-selected-summary" class="veb-selected-summary">수신자를 선택해 주세요.</p>
        </section>

        <section class="vei-panel veb-compose">
            <div class="veb-field">
                <label for="veb-subject">제목</label>
                <input type="text" id="veb-subject" class="veb-subject" placeholder="안녕하세요. 공지드립니다.">
            </div>
            <div class="veb-field">
                <label for="veb-greeting">인사말/본문</label>
                <textarea id="veb-greeting" class="veb-textarea" rows="12"></textarea>
            </div>
            <div class="veb-attach-block">
                <label>첨부서류</label>
                <input type="file" id="veb-files" class="veb-file-input" multiple accept=".pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,image/*">
                <button type="button" class="btn" id="veb-file-pick-btn">파일선택</button>
                <ul id="veb-attach-list" class="veb-attach-list" aria-live="polite"></ul>
            </div>
            <div class="veb-send-actions">
                <button type="button" class="btn btn-primary" id="veb-send-btn">메일보내기</button>
            </div>
            <div id="veb-failed-wrap" class="veb-failed" hidden>
                <h3>실패 주소 리포트</h3>
                <ul id="veb-failed-list" class="veb-failed-list"></ul>
            </div>
        </section>
    </main>

    <div id="veb-picker-modal" class="veb-modal" hidden role="dialog" aria-modal="true" aria-labelledby="veb-picker-title">
        <div class="veb-modal__panel">
            <div class="veb-picker-head">
                <h2 id="veb-picker-title">수신자 선택</h2>
                <button type="button" class="btn" id="veb-picker-close">닫기</button>
            </div>
            <div class="veb-picker-bulk" aria-label="일괄 선택">
                <button type="button" class="btn" id="veb-bulk-company">회사만 선택</button>
                <button type="button" class="btn" id="veb-bulk-manager">담당자만 선택</button>
                <button type="button" class="btn" id="veb-bulk-both">회사+담당자 선택</button>
                <button type="button" class="btn" id="veb-bulk-clear">선택 해제</button>
            </div>
            <div class="veb-picker-scroll">
                <table class="veb-picker-table">
                    <thead>
                        <tr>
                            <th class="veb-col-type">분류</th>
                            <th class="veb-col-name">업체 이름</th>
                            <th class="veb-col-check">회사 이메일</th>
                            <th class="veb-col-check">담당자 이메일</th>
                        </tr>
                    </thead>
                    <tbody id="veb-picker-body"></tbody>
                </table>
                <p id="veb-picker-empty" class="veb-picker-empty" hidden>표시할 업체가 없습니다.</p>
            </div>
            <div class="veb-picker-foot">
                <button type="button" class="btn" id="veb-picker-cancel">취소</button>
                <button type="button" class="btn btn-primary" id="veb-picker-apply">선택 완료</button>
            </div>
        </div>
    </div>

    <div id="veb-success-modal" class="veb-modal" hidden role="dialog" aria-modal="true" aria-labelledby="veb-success-title">
        <div class="veb-modal__panel veb-modal__panel--compact">
            <h2 id="veb-success-title">메일이 정상적으로 발송이 완료 되었습니다.</h2>
            <p>계속해서 메일 보내기를 하겠습니까?</p>
            <div class="veb-modal__actions">
                <button type="button" class="btn btn-primary" id="veb-success-yes">예</button>
                <button type="button" class="btn" id="veb-success-no">아니오</button>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script src="product-form-shared.js"></script>
    <script src="vendor-email-broadcast.js"></script>
</body>
</html>
