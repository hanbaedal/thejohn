<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>이메일 보내기 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="admin-manage.css">
    <style>
        .veb-row { margin-top: 0.5rem; }
        .veb-subject { min-width: 26rem; max-width: 100%; }
        .veb-textarea { width: 100%; max-width: 58rem; }
        .veb-test-email { min-width: 22rem; max-width: 100%; }
        .veb-history {
            margin-top: 1rem;
            border-top: 1px dashed #d5deea;
            padding-top: 0.9rem;
        }
        .veb-history-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 19rem;
            overflow-y: auto;
            padding-right: 0.2rem;
        }
        .veb-history-list li {
            border: 1px solid #e7edf4;
            border-radius: 8px;
            padding: 0.55rem 0.7rem;
            margin-bottom: 0.45rem;
            background: #fff;
            font-size: 0.86rem;
            color: #3b4f62;
        }
        .veb-history-title { margin: 0; }
        .veb-date-input { min-width: 10rem; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="index.html" class="dz-logo dz-logo--compact" aria-label="더존 홈"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar">
        <p class="am-subnav"><a href="vendor-manage.html">← 업체관리</a></p>
        <h1>이메일 보내기</h1>
        <p id="veb-status" class="vl-status" role="status" aria-live="polite"></p>
        <section class="vei-panel">
            <div class="vei-file-row">
                <label><input type="checkbox" id="veb-include-vendors" checked> 업체 리스트(vendors)</label>
                <label><input type="checkbox" id="veb-include-vendor-new" checked> 신규업체(vendor_new)</label>
                <label><input type="checkbox" id="veb-only-mine" checked> 내가 등록한 업체만</label>
            </div>
            <div class="vei-file-row veb-row">
                <span>수신 이메일 선택</span>
                <label><input type="radio" name="veb-recipient-mode" id="veb-recipient-company" value="company" checked> 회사 이메일</label>
                <label><input type="radio" name="veb-recipient-mode" id="veb-recipient-manager" value="manager"> 담당자 이메일</label>
            </div>
            <div class="vei-file-row veb-row">
                <label for="veb-subject">제목</label>
                <input type="text" id="veb-subject" class="veb-subject" placeholder="안녕하세요. 공지드립니다.">
            </div>
            <div class="veb-row">
                <label for="veb-greeting">인사말/본문</label>
                <textarea id="veb-greeting" class="veb-textarea" rows="10"></textarea>
            </div>
            <div class="veb-row">
                <label for="veb-files">첨부서류</label>
                <input type="file" id="veb-files" multiple>
                <p class="vei-hint">간단형 기능: 최대 5개 파일, 파일당 4MB 권장</p>
            </div>
            <div class="vei-actions">
                <input type="email" id="veb-test-email" class="veb-test-email" placeholder="테스트 수신 이메일">
                <button type="button" class="btn" id="veb-test-btn">테스트 발송</button>
                <button type="button" class="btn btn-primary" id="veb-send-btn">메일 보내기</button>
            </div>
            <div id="veb-failed-wrap" class="veb-history" hidden>
                <h3>실패 주소 리포트</h3>
                <ul id="veb-failed-list" class="veb-history-list"></ul>
            </div>
            <div class="veb-history">
                <div class="vei-actions">
                    <h3 class="veb-history-title">발송 이력</h3>
                    <label for="veb-history-date-from" class="sr-only">발송이력 시작일</label>
                    <input type="date" id="veb-history-date-from" class="veb-date-input">
                    <span>~</span>
                    <label for="veb-history-date-to" class="sr-only">발송이력 종료일</label>
                    <input type="date" id="veb-history-date-to" class="veb-date-input">
                </div>
                <ul id="veb-history-list" class="veb-history-list"></ul>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script src="vendor-email-broadcast.js"></script>
</body>
</html>
