<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <link rel="icon" href="img/icon-192.png" sizes="192x192" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>로그인 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="login.css">
    <style>
        /* common.css 로드 전에도 로그인 폼 표시 */
        body.page-login { display: flex; flex-direction: column; min-height: 100dvh; margin: 0; background: #f4f6f9; }
        body.page-login .login-page,
        body.page-login .login-card { display: flex !important; visibility: visible !important; }
        body.page-login .login-card { display: block !important; flex-direction: column; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
</head>
<body class="page-login">
    <header class="login-header">
        <a href="index.html" class="dz-logo dz-logo--compact" aria-label="더존 홈">
            <img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img">
        </a>
    </header>

    <main class="login-page">
        <div class="login-card">
            <h1>로그인</h1>
            <form id="loginForm" action="login.html" method="post" novalidate>
                <div class="login-field">
                    <label for="userId">아이디</label>
                    <input id="userId" name="userId" type="text" autocomplete="username" required>
                </div>
                <div class="login-field">
                    <label for="password">비밀번호</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required spellcheck="false">
                </div>
                <div class="login-actions">
                    <button type="submit" class="login-submit">로그인</button>
                    <a href="index.html" class="login-guest">게스트</a>
                </div>
            </form>
        </div>
    </main>

    <div id="loginBusyModal" class="login-busy-modal" hidden role="alertdialog" aria-modal="true" aria-labelledby="loginBusyTitle">
        <div class="login-busy-modal__panel">
            <h2 id="loginBusyTitle">로그인 불가</h2>
            <p id="loginBusyMsg">다른곳에서 로그인해서 사용중입니다!</p>
            <p id="loginBusyTimer" class="login-busy-modal__timer" aria-live="polite"></p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
