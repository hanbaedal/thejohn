    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                var y = now.getFullYear();
                var m = String(now.getMonth() + 1).padStart(2, "0");
                var d = String(now.getDate()).padStart(2, "0");
                todayEl.dateTime = y + "-" + m + "-" + d;
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            function syncAuthUi() {
                var loggedIn = window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn();
                if (logoutBtn) logoutBtn.hidden = !loggedIn;
            }
            if (logoutBtn) {
                logoutBtn.addEventListener("click", function () {
                    if (window.THEJHON_AUTH) THEJHON_AUTH.clearSession();
                    location.reload();
                });
            }
            syncAuthUi();
        })();
    </script>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);

            if (window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn()) {
                window.location.replace(THEJHON_AUTH.safeNextPath(params.get("next")));
                return;
            }

            var form = document.getElementById("loginForm");
            var guestBtn = document.getElementById("btnGuestLogin");

            function goAfterLogin() {
                window.location.href = THEJHON_AUTH.safeNextPath(params.get("next"));
            }

            if (!form) return;

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                var id = document.getElementById("userId").value.trim();
                var pw = document.getElementById("password").value;
                if (!id || !pw) {
                    alert("아이디와 비밀번호를 입력해 주세요.");
                    return;
                }
                if (!window.THEJHON_AUTH) {
                    alert("인증 스크립트(auth.js)를 불러오지 못했습니다.");
                    return;
                }
                function applyLoginSession(ok) {
                    THEJHON_AUTH.setFormSession(
                        ok.userId,
                        ok.role,
                        ok.token,
                        ok.companyName,
                        ok.displayName
                    );
                    if (THEJHON_AUTH.applyNavRegisterVisibility) {
                        THEJHON_AUTH.applyNavRegisterVisibility();
                    }
                    goAfterLogin();
                }

                THEJHON_AUTH.verifyFormCredentialsAsync(id, pw)
                    .then(function (ok) {
                        if (!ok) {
                            alert("아이디 또는 비밀번호가 올바르지 않습니다.");
                            return;
                        }
                        applyLoginSession(ok);
                    })
                    .catch(function (err) {
                        if (err && err.code === "NOT_REGISTERED") {
                            var regMsg =
                                err.message ||
                                "더존 관리자에게 회원 등록을 요청해야 합니다.";
                            if (err.data && err.data.hint) regMsg += "\n\n" + err.data.hint;
                            else if (/thejhon/i.test(id)) {
                                regMsg += "\n\n아이디는 thejohn 입니다. (thejhon 은 옛 아이디)";
                            }
                            alert(regMsg);
                            if (!confirm("게스트로 로그인 하겠습니까?")) return;
                            THEJHON_AUTH.loginAsGuestAsync()
                                .then(function (guestOk) {
                                    if (!guestOk) {
                                        alert("게스트 로그인을 사용할 수 없습니다.");
                                        return;
                                    }
                                    applyLoginSession(guestOk);
                                })
                                .catch(function (guestErr) {
                                    alert(
                                        (guestErr && guestErr.message) ||
                                            "게스트 로그인에 실패했습니다."
                                    );
                                });
                            return;
                        }
                        alert((err && err.message) || "로그인에 실패했습니다.");
                    });
            });

            if (guestBtn) {
                guestBtn.addEventListener("click", function () {
                    if (!window.THEJHON_AUTH) {
                        alert("인증 스크립트(auth.js)를 불러오지 못했습니다.");
                        return;
                    }
                    THEJHON_AUTH.loginAsGuestAsync().then(function (ok) {
                        if (!ok) {
                            alert("게스트 로그인을 사용할 수 없습니다.");
                            return;
                        }
                        THEJHON_AUTH.setFormSession(
                            ok.userId,
                            ok.role,
                            ok.token,
                            ok.companyName,
                            ok.displayName
                        );
                        goAfterLogin();
                    })
                    .catch(function (err) {
                        alert((err && err.message) || "게스트 로그인에 실패했습니다.");
                    });
                });
            }
        })();
    </script>
