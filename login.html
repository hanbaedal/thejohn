<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <link rel="icon" href="img/icon-192.png" sizes="192x192" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>로그인 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="login.css">
    <style>
        /* common.css 로드 전에도 로그인 폼 표시 */
        body.page-login { display: flex; flex-direction: column; min-height: 100dvh; margin: 0; background: #f4f6f9; }
        body.page-login .login-page,
        body.page-login .login-card { display: flex !important; visibility: visible !important; }
        body.page-login .login-card { display: block !important; flex-direction: column; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
</head>
<body class="page-login">
    <header class="login-header">
        <a href="index.html" class="dz-logo dz-logo--compact" aria-label="더존 홈">
            <img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img">
        </a>
    </header>

    <main class="login-page">
        <div class="login-card">
            <h1>로그인</h1>
            <p class="login-intro">관리자·업체는 아이디로 로그인합니다. 외부 방문은 <strong>게스트 로그인</strong>을 이용해 주세요.</p>
            <form id="loginForm" action="login.html" method="post" novalidate>
                <div class="login-field">
                    <label for="userId">아이디</label>
                    <input id="userId" name="userId" type="text" autocomplete="username" required placeholder="아이디를 입력하세요" spellcheck="false">
                </div>
                <div class="login-field">
                    <label for="password">비밀번호</label>
                    <div class="login-password-wrap">
                        <input id="password" name="password" type="password" autocomplete="current-password" required spellcheck="false" placeholder="비밀번호를 입력하세요">
                        <button type="button" class="login-password-toggle" id="passwordToggle" aria-label="비밀번호 표시" aria-pressed="false" title="비밀번호 표시">
                            <svg class="login-password-icon login-password-icon--closed" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
                            <svg class="login-password-icon login-password-icon--open" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="login-actions">
                    <button type="submit" class="login-submit">로그인</button>
                    <button type="button" class="login-guest">게스트 로그인</button>
                </div>
            </form>
        </div>
    </main>

    <div id="loginBusyModal" class="login-busy-modal" hidden role="alertdialog" aria-modal="true" aria-labelledby="loginBusyTitle">
        <div class="login-busy-modal__panel">
            <h2 id="loginBusyTitle">로그인 불가</h2>
            <p id="loginBusyMsg">다른곳에서 로그인해서 사용중입니다!</p>
            <p id="loginBusyTimer" class="login-busy-modal__timer" aria-live="polite"></p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
