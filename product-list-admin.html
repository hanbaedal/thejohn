<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="public-site-config.js?v=20260620"></script>
    <script src="auth-storage.js?v=20260620-public"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>상품 리스트 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="admin-manage.css">
    <style>
        .vl-admin-list { list-style: none; margin: 0; padding: 0; }
        .pl-admin-thumb {
            position: relative;
            flex: 0 0 3.5rem;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 8px;
            border: 1px solid #e0e6ed;
            background: #f0f3f7;
            overflow: hidden;
        }
        .pl-photo-count {
            position: absolute;
            right: 1px;
            bottom: 1px;
            padding: 0.05rem 0.25rem;
            font-size: 0.58rem;
            font-weight: 700;
            line-height: 1.15;
            color: #fff;
            background: rgba(10, 77, 156, 0.85);
            border-radius: 3px;
            pointer-events: none;
        }
        .pl-admin-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .pl-admin-thumb--empty {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.62rem;
            color: #8a9bab;
            text-align: center;
            line-height: 1.2;
            padding: 0.2rem;
        }
        .pl-admin-row {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.75rem 0.85rem;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: #fff;
        }
        .pl-admin-row:hover { border-color: #b8c8dc; background: #f8fbff; }
        .pl-admin-row__main {
            flex: 1;
            min-width: 0;
            text-decoration: none;
            color: inherit;
        }
        .pl-admin-row__main:hover .vl-admin-name { color: var(--dz-blue); }
        .vl-admin-name { display: block; font-weight: 700; color: #052a4d; margin-bottom: 0.2rem; }
        .vl-admin-meta { font-size: 0.85rem; color: #5a6d7e; }
        .pl-admin-row__actions {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 0.25rem;
            margin-left: auto;
            justify-content: flex-end;
        }
        .pl-admin-row__actions .btn,
        .pl-admin-row__actions .pl-admin-act {
            font-size: 0.7rem;
            line-height: 1.2;
            padding: 0.18rem 0.45rem;
            min-height: 0;
            min-width: 0;
            white-space: nowrap;
            border-radius: 4px;
        }
        .pl-admin-edit {
            border-color: #c5d4e8;
            color: #2a5080;
            background: #fff;
        }
        .pl-admin-edit:hover {
            background: #f0f6fc;
            border-color: var(--dz-blue);
            color: var(--dz-blue);
        }
        .pl-admin-del {
            border-color: #e8b4b4;
            color: #a12c2c;
            background: #fff;
        }
        .pl-admin-del:hover {
            background: #fef5f5;
            border-color: #c44;
        }
        .pl-admin-row--readonly {
            background: #f7f9fb;
        }
        .pl-admin-row--readonly:hover {
            border-color: #e0e6ed;
            background: #f7f9fb;
        }
        .pl-admin-row__main--readonly {
            cursor: default;
        }
        .pl-admin-readonly-tag {
            flex: 0 0 auto;
            margin-left: auto;
            font-size: 0.68rem;
            color: #6b7c8f;
            padding: 0.25rem 0.5rem;
            border: 1px solid #dce3eb;
            border-radius: 999px;
            background: #fff;
            white-space: nowrap;
        }
        .vl-status { margin: 0 0 1rem; font-size: 0.85rem; color: #3d5166; min-height: 1.25rem; }
        @media (max-width: 520px) {
            .pl-admin-row {
                flex-wrap: nowrap;
                align-items: center;
                gap: 0.45rem;
            }
            .pl-admin-row__actions {
                flex-shrink: 0;
            }
        }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <link rel="stylesheet" href="staff-hub.css">
    <script src="auth.js?v=20260530-product-nav"></script>
    <script src="admin-header.js"></script>
    <script src="product-catalog.js"></script>
    <script src="product-form-shared.js"></script>
    <script src="vendor-admin-shared.js"></script>
    <script src="nav.js?v=20260530-product-nav" defer></script>
    <script src="staff-product-boot.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--product" aria-label="상품관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar">
        <p class="am-subnav"><a href="product-manage.html">← 상품관리</a></p>
        <h1>상품 리스트</h1>
        <p id="pl-status" class="vl-status" role="status" aria-live="polite" hidden></p>
        <div id="pl-staff-filter-wrap" class="am-filter-bar" hidden>
            <label for="pl-staff-filter" class="am-dept-caption">등록 담당</label>
            <select id="pl-staff-filter" class="vr-select" style="max-width:18rem">
                <option value="all">전체 관리자</option>
            </select>
        </div>
        <div class="am-filter-bar am-dept-picker">
            <span class="am-dept-caption">사업부문 선택</span>
            <input type="hidden" id="pl-filter-dept" value="">
            <div id="pl-dept-filter" class="am-dept-picker-btns"></div>
        </div>
        <div id="pl-list"></div>
    </main>
        <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
</div>
    </footer>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                todayEl.dateTime = now.toISOString().slice(0, 10);
                todayEl.textContent = now.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
            }
            var logoutBtn = document.getElementById("btnLogout");
            if (logoutBtn) {logoutBtn.hidden = !(window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn());
            }
        })();
    </script>
    <script src="product-cover-cache.js"></script>
    <script src="product-list-admin.js"></script>
</body>
</html>
