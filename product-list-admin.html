<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 리스트 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="admin-manage.css">
    <style>
        .vl-admin-list { list-style: none; margin: 0; padding: 0; }
        .vl-admin-item {
            display: block;
            padding: 0.85rem 1rem;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            text-decoration: none;
            color: inherit;
            background: #fff;
        }
        .vl-admin-item:hover { border-color: var(--dz-blue); background: #f8fbff; }
        .vl-admin-name { display: block; font-weight: 700; color: #052a4d; margin-bottom: 0.2rem; }
        .vl-admin-meta { font-size: 0.85rem; color: #5a6d7e; }
        .vl-status { margin: 0 0 1rem; font-size: 0.85rem; color: #3d5166; min-height: 1.25rem; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="admin-header.js"></script>
    <script src="product-catalog.js"></script>
    <script src="product-form-shared.js"></script>
    <script src="vendor-admin-shared.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <div class="nav-dropdown" data-nav-dropdown="support">
                    <a href="support.html" class="header-nav-link nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="supportSubmenu">고객센터</a>
                    <div id="supportSubmenu" class="nav-dropdown-panel" role="menu" aria-label="고객센터 하위 메뉴">
                        <a href="support-partners.html" class="nav-dropdown-item" role="menuitem">파트너회사 소개</a>
                        <a href="support-library.html" class="nav-dropdown-item" role="menuitem">최근소식</a>
                        <a href="support-qna.html" class="nav-dropdown-item" role="menuitem">자유게시판</a>
                        <a href="support-inquiry.html" class="nav-dropdown-item" role="menuitem">문의사항</a>
                    </div>
                </div>
                <span class="header-nav-link is-static" title="준비 중입니다">카페</span>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar">
        <p class="am-subnav"><a href="product-manage.html">← 상품관리</a></p>
        <h1>상품 리스트</h1>
        <p id="pl-status" class="vl-status" role="status" aria-live="polite"></p>
        <div id="pl-staff-filter-wrap" class="am-filter-bar" hidden>
            <label for="pl-staff-filter" class="am-dept-caption">등록 담당</label>
            <select id="pl-staff-filter" class="vr-select" style="max-width:18rem">
                <option value="all">전체 관리자</option>
            </select>
        </div>
        <div class="am-filter-bar am-dept-picker">
            <span class="am-dept-caption">사업부문 선택</span>
            <input type="hidden" id="pl-filter-dept" value="">
            <div id="pl-dept-filter" class="am-dept-picker-btns"></div>
        </div>
        <div id="pl-list"></div>
    </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid">
                <div class="site-footer-item"><dt>상호</dt><dd>(주)더존</dd></div>
            </dl>
        </div>
    </footer>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                todayEl.dateTime = now.toISOString().slice(0, 10);
                todayEl.textContent = now.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
            }
            var logoutBtn = document.getElementById("btnLogout");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", function () {
                    if (window.THEJHON_AUTH) THEJHON_AUTH.clearSession();
                    location.reload();
                });
                logoutBtn.hidden = !(window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn());
            }
        })();
    </script>
    <script src="product-list-admin.js"></script>
</body>
</html>
