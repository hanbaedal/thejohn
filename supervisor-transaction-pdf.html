<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js?v=20260619-public-gate"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <title>거래명세서 PDF로 보기 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="admin-manage.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="order-list-filters.css">
    <link rel="stylesheet" href="order-manage-layout.css">
    <style>
        .ol-admin-list { list-style: none; margin: 0; padding: 0; }
        .ol-list-scroll { max-height: 22rem; overflow-y: auto; }
        .ol-admin-item {
            display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
            padding: 0.85rem 1rem; border: 1px solid #e0e6ed; border-radius: 8px;
            margin-bottom: 0.5rem; background: #fff;
        }
        .ol-admin-main { flex: 1; min-width: 12rem; }
        .ol-admin-name { display: block; font-weight: 700; color: #052a4d; }
        .ol-admin-meta { font-size: 0.85rem; color: #5a6d7e; }
        .ol-admin-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
        .ol-admin-actions .btn { font-size: 0.8rem; padding: 0.3rem 0.65rem; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="order-ui.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar shub-page om-page">
        <p class="shub-subnav"><a href="order-manage-hub.html">← 발주서 관리</a></p>
        <h1>거래명세서 PDF로 보기</h1>
        <p id="ompl-status" class="shub-status" role="status" aria-live="polite"></p>
        <div class="ol-query-filters" aria-label="거래명세서 조회 조건">
            <section class="ol-query-filters__section" aria-labelledby="ompl-filter-period-heading">
                <h2 id="ompl-filter-period-heading" class="ol-query-filters__heading">기간으로조회</h2>
                <div class="ol-query-filters__row">
                    <label for="ompl-date-from">시작일</label>
                    <input type="date" id="ompl-date-from">
                </div>
                <div class="ol-query-filters__row">
                    <label for="ompl-date-to">종료일</label>
                    <input type="date" id="ompl-date-to">
                </div>
            </section>
            <section class="ol-query-filters__section" id="ompl-filter-admin" aria-labelledby="ompl-filter-admin-heading">
                <h2 id="ompl-filter-admin-heading" class="ol-query-filters__heading">담당관리자조회</h2>
                <div class="ol-query-filters__row ol-query-filters__row--query">
                    <label for="ompl-admin">담당 관리자</label>
                    <select id="ompl-admin">
                        <option value="">전체</option>
                    </select>
                    <button type="button" class="btn btn-primary" id="ompl-search">조회</button>
                </div>
            </section>
        </div>
        <section class="shub-panel">
            <div id="ompl-summary" class="shub-summary" hidden></div>
            <div id="ompl-list" class="ol-list-scroll"></div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script>window.OMPL_CONFIG = { mode: "transaction", idPrefix: "ompl" };</script>
    <script src="order-manage-pdf-list.js"></script>
</body>
</html>
