<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <title>업체별 DM 출력 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="admin-manage.css">
    <link rel="stylesheet" href="vendor-dm-print.css">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="staff-vendor-boot.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--vendor" aria-label="업체관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar">
        <p class="am-subnav"><a href="vendor-manage.html">← 업체관리</a></p>
        <div class="vdm-page-head vdm-compose">
            <h1>업체별 DM 출력</h1>
            <button type="button" class="btn btn-primary" id="vdm-print-btn">출력</button>
        </div>
        <p id="vdm-status" class="vl-status vdm-compose" role="status" aria-live="polite"></p>

        <section class="vdm-source vdm-compose">
            <p class="vdm-source-title">출력 대상 업체 분류</p>
            <div class="vdm-source-options" aria-label="출력 대상 업체 분류">
                <label>
                    <input type="checkbox" id="vdm-src-vendors" value="vendors" checked>
                    <span>등록업체<small>거래하고 있는 등록업체</small></span>
                </label>
                <label>
                    <input type="checkbox" id="vdm-src-vendor-new" value="vendor_new" checked>
                    <span>신규업체<small>새롭게 마케팅하는 업체</small></span>
                </label>
            </div>
            <button type="button" class="btn btn-primary" id="vdm-pick-btn">수신자 선택</button>
            <p id="vdm-selected-summary" class="vdm-selected-summary">수신자를 선택해 주세요.</p>
        </section>

        <section class="vdm-output vdm-compose">
            <p class="vdm-output-title">출력 선택</p>
            <div class="vdm-output-options" role="radiogroup" aria-label="봉투 종류">
                <label>
                    <input type="radio" name="vdm-envelope" id="vdm-env-large" value="large" checked>
                    <span>대봉투</span>
                </label>
                <label>
                    <input type="radio" name="vdm-envelope" id="vdm-env-regular" value="regular">
                    <span>일반봉투</span>
                </label>
            </div>
        </section>
    </main>

    <div id="vdm-picker-modal" class="vdm-modal" hidden role="dialog" aria-modal="true" aria-labelledby="vdm-picker-title">
        <div class="vdm-modal__panel">
            <div class="vdm-picker-head">
                <h2 id="vdm-picker-title">수신자 선택</h2>
                <button type="button" class="btn" id="vdm-picker-close">닫기</button>
            </div>
            <div class="vdm-picker-bulk" aria-label="일괄 선택">
                <button type="button" class="btn" id="vdm-bulk-company">회사만 선택</button>
                <button type="button" class="btn" id="vdm-bulk-manager">담당자만 선택</button>
                <button type="button" class="btn" id="vdm-bulk-both">회사+담당자 선택</button>
                <button type="button" class="btn" id="vdm-bulk-clear">선택 해제</button>
            </div>
            <div class="vdm-picker-scroll">
                <table class="vdm-picker-table">
                    <thead>
                        <tr>
                            <th class="vdm-col-type">분류</th>
                            <th class="vdm-col-name">업체 이름</th>
                            <th class="vdm-col-check">회사</th>
                            <th class="vdm-col-check">담당자</th>
                        </tr>
                    </thead>
                    <tbody id="vdm-picker-body"></tbody>
                </table>
                <p id="vdm-picker-empty" class="vdm-picker-empty" hidden>표시할 업체가 없습니다.</p>
            </div>
            <div class="vdm-picker-foot">
                <button type="button" class="btn" id="vdm-picker-cancel">취소</button>
                <button type="button" class="btn btn-primary" id="vdm-picker-apply">선택 완료</button>
            </div>
        </div>
    </div>

    <div id="vdm-print-area" class="vdm-print-area" aria-hidden="true"></div>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script src="address-fields.js"></script>
    <script src="vendor-dm-print.js"></script>
</body>
</html>
