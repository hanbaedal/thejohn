<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>관리자관리 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="업무관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="staff-manage-hub.html" class="header-nav-link is-current">업무관리</a>
                <a href="staff-manage.html" class="header-nav-link">관리자 등록</a>
                <a href="staff-list-admin.html" class="header-nav-link">관리자 리스트</a>
                <a href="supervisor-order-list.html" class="header-nav-link">발주서 관리</a>
                <a href="supervisor-transaction-list.html" class="header-nav-link">거래명세서</a>
                <a href="supervisor-access-stats.html" class="header-nav-link">접속통계</a>
                <a href="supervisor-db-stats.html" class="header-nav-link">디비사용 통계</a>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar company-main company-main--support-hub">
        <h1>관리자관리</h1>
        <p id="shub-status" class="shub-status" role="status" aria-live="polite"></p>
        <div class="company-divisions sm-hub-rows">
            <div class="sm-hub-row">
                <a href="staff-manage.html" class="company-division-card">
                    <h2>관리자 등록</h2>
                    <p>새 관리자 계정을 등록합니다.</p>
                </a>
                <a href="staff-list-admin.html" class="company-division-card">
                    <h2>관리자 리스트</h2>
                    <p>목록에서 선택해 수정·삭제·접속·주문 권한을 설정합니다.</p>
                </a>
            </div>
            <div class="sm-hub-row">
                <a href="supervisor-order-list.html" class="company-division-card">
                    <h2>발주서 관리</h2>
                    <p>기간·담당 관리자별로 발주(주문) 내역과 통계를 조회합니다.</p>
                </a>
                <a href="supervisor-transaction-list.html" class="company-division-card">
                    <h2>거래명세서</h2>
                    <p>기간·담당 관리자별 거래명세서를 조회·출력합니다.</p>
                </a>
            </div>
            <div class="sm-hub-row">
                <a href="supervisor-access-stats.html" class="company-division-card">
                    <h2>접속통계 관리</h2>
                    <p>관리자·업체 로그인 및 비로그인 방문 기록을 날짜별로 확인합니다.</p>
                </a>
                <a href="supervisor-db-stats.html" class="company-division-card">
                    <h2>디비사용 통계</h2>
                    <p>상품·업체·발주 등 컬렉션 데이터를 관리자별로 집계합니다.</p>
                </a>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script src="staff-manage-hub.js"></script>
</body>
</html>
