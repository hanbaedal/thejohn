<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icon-192.png" sizes="192x192" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <link rel="apple-touch-icon" sizes="192x192" href="img/icon-192.png">
    <title>예비업체 리스트 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="admin-manage.css">
    <style>
        .vl-admin-list { list-style: none; margin: 0; padding: 0; }
        .vl-admin-row {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.75rem 0.85rem;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: #fff;
        }
        .vl-admin-row:hover { border-color: #b8c8dc; background: #f8fbff; }
        .vl-admin-row__main { flex: 1; min-width: 0; }
        .vl-admin-name { display: block; font-weight: 700; color: #052a4d; margin-bottom: 0.2rem; }
        .vl-admin-meta { font-size: 0.85rem; color: #5a6d7e; }
        .vl-admin-row__actions {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            justify-content: flex-end;
        }
        .vl-admin-row__actions .btn {
            font-size: 0.82rem;
            padding: 0.4rem 0.7rem;
            min-height: 2.25rem;
            white-space: nowrap;
        }
        .vl-admin-del {
            border-color: #e8b4b4;
            color: #a12c2c;
            background: #fff;
        }
        .vl-admin-del:hover {
            background: #fef5f5;
            border-color: #c44;
        }
        .vl-status { margin: 0 0 1rem; font-size: 0.85rem; color: #3d5166; min-height: 1.25rem; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="admin-header.js"></script>
    <script src="product-form-shared.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="index.html" class="dz-logo dz-logo--compact" aria-label="더존 홈"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar">
        <p class="am-subnav"><a href="vendor-manage.html">← 업체관리</a> · <a href="vendor-prospect-finder.html">예비 업체 찾기</a></p>
        <h1>예비업체 리스트</h1>
        <p id="vpl-status" class="vl-status" role="status" aria-live="polite"></p>
        <div id="vpl-list"></div>
    </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script src="vendor-prospect-list.js"></script>
</body>
</html>
