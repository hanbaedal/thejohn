<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js?v=20260619-public-gate"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>업체 상세 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <style>
        .vd-back { margin: 0 0 1rem; }
        .vd-back a {
            color: var(--dz-blue);
            font-weight: 600;
            text-decoration: none;
        }
        .vd-back a:hover { text-decoration: underline; }
        .vd-missing { margin: 0; color: #3d5166; line-height: 1.55; }
        .vd-missing a { color: var(--dz-blue); font-weight: 600; }
        .vd-article {
            max-width: 48rem;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 14px rgba(10, 77, 156, 0.08);
        }
        .vd-hero-img {
            width: 100%;
            max-height: min(50vh, 20rem);
            object-fit: contain;
            display: block;
            background: #f4f6f9;
        }
        .vd-hero-img--empty {
            min-height: 10rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #8a9bab;
        }
        .vd-text { padding: 1.25rem 1.35rem 1.75rem; }
        .vd-title {
            margin: 0 0 0.35rem;
            font-size: 1.45rem;
            font-weight: 700;
            color: #052a4d;
            line-height: 1.35;
        }
        .vd-badge {
            display: inline-block;
            margin: 0 0 0.75rem;
            padding: 0.2rem 0.55rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: #0a4d9c;
            background: #e8f2fc;
            border-radius: 4px;
        }
        .vd-spec {
            margin: 0 0 0.5rem;
            font-size: 0.95rem;
            color: #3d556d;
        }
        .vd-note {
            margin: 1rem 0 0;
            padding: 0.85rem 1rem;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #3d5166;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .vd-contact {
            margin: 1.25rem 0 0;
            padding-top: 1rem;
            border-top: 1px solid #e8edf2;
            display: grid;
            grid-template-columns: 6.5rem minmax(0, 1fr);
            gap: 0.35rem 0.75rem;
            font-size: 0.92rem;
        }
        .vd-contact dt { margin: 0; font-weight: 700; color: #2a4a5e; }
        .vd-contact dd { margin: 0; color: #3d5166; word-break: break-word; }
        .vd-contact a { color: var(--dz-blue); text-decoration: none; }
        .vd-contact a:hover { text-decoration: underline; }
        .vd-biz-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.5rem 1rem;
        }
        .vd-biz-cell { min-width: 0; }
        .vd-biz-label {
            display: block;
            font-weight: 700;
            color: #2a4a5e;
            font-size: 0.82rem;
            margin-bottom: 0.15rem;
        }
        .vd-biz-value { color: #3d5166; word-break: break-word; }
        .vd-biz-dt { align-self: start; }
        .vd-biz-dd { grid-column: 2; }
        @media (max-width: 640px) {
            .vd-biz-row { grid-template-columns: 1fr; }
        }
        .vd-actions {
            margin-top: 1.25rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .vd-actions a {
            display: inline-block;
            padding: 0.45rem 0.9rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--dz-blue);
            border: 1px solid var(--dz-blue);
            border-radius: 6px;
            text-decoration: none;
        }
        .vd-actions a:hover { background: #f0f7ff; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="staff-vendor-boot.js"></script>
    <script src="admin-header.js"></script>
    <script src="product-catalog.js"></script>
    <script src="product-form-shared.js"></script>
    <script src="nav.js" defer></script>
    <script src="vendor-detail.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--vendor" aria-label="업체관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main">
        <p class="vd-back"><a href="vendor-list-admin.html">← 업체 리스트</a></p>
        <div id="vd-root" aria-live="polite"></div>
    </main>
        <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
</div>
    </footer>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                todayEl.dateTime = now.toISOString().slice(0, 10);
                todayEl.textContent = now.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
            }
            var logoutBtn = document.getElementById("btnLogout");
            if (logoutBtn) {logoutBtn.hidden = !(window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn());
            }
        })();
    </script>
</body>
</html>
