<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="home-intro-media.css">
    <style>
        .company-main--home {
            justify-content: center;
            padding: 0;
            max-width: none;
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .home-intro {
            flex: 1;
            min-height: min(72vh, calc(100dvh - 11rem));
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-intro-copy {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 36rem;
            padding: 1.5rem 1rem 2rem;
        }
        .home-intro-copy .company-hero {
            text-shadow: 0 1px 12px rgba(255, 255, 255, 0.9);
        }
        .home-intro-copy .company-taglines p {
            text-shadow: 0 1px 8px rgba(255, 255, 255, 0.85);
        }
        /* index — 로그인 전 placeholder만 숨김 (게스트·관리자·슈퍼바이저 포함 로그인 시 표시) */
        html.page-home-doc:not(.site-brand-has-logo):not(.site-brand-active) .dz-logo-img {
            opacity: 0;
            visibility: hidden;
        }
        html.page-home-doc.site-brand-active.site-brand-has-logo .dz-logo,
        html.page-home-doc.site-brand-active.site-brand-has-logo .dz-logo-img {
            opacity: 1 !important;
            visibility: visible !important;
        }
        html.page-home-doc .home-intro-video {
            opacity: 1;
            visibility: visible;
        }
        /* Galaxy S25 (약 360×780) — 인삿말·대표명 한 화면 */
        @media (max-width: 430px) {
            html:has(body.page-home),
            body.page-home {
                height: 100svh;
                height: 100dvh;
                max-height: 100svh;
                max-height: 100dvh;
                overflow: hidden;
            }
            body.page-home {
                display: flex;
                flex-direction: column;
            }
            body.page-home .site-header {
                flex: 0 0 auto;
                --header-pad-y: 0.55rem;
                gap: 0.15rem 0.35rem;
            }
            body.page-home .site-header-brand .dz-logo {
                width: 2.25rem;
                height: 2.25rem;
            }
            body.page-home .company-main--home {
                flex: 1 1 auto;
                min-height: 0;
                overflow: hidden;
            }
            body.page-home .home-intro {
                flex: 1 1 auto;
                min-height: 0 !important;
                align-items: center;
                justify-content: center;
            }
            body.page-home .home-intro-copy {
                padding: 0.65rem 0.75rem 0.75rem;
            }
            body.page-home .home-intro-copy .company-hero-stack {
                gap: 0.65rem;
            }
            body.page-home .home-intro-copy .company-hero {
                font-size: clamp(1.4rem, 4.2vw + 0.55rem, 1.75rem);
                line-height: 1.06;
            }
            body.page-home .home-intro-copy .company-taglines {
                padding: 0 0.35rem;
            }
            body.page-home .home-intro-copy .company-taglines p {
                font-size: clamp(0.76rem, 1vw + 0.46rem, 0.88rem);
                line-height: 1.32;
                margin: 0 0 0.28rem;
            }
            body.page-home .home-intro-copy .company-taglines p:last-child {
                margin-bottom: 0;
            }
            body.page-home .home-bgm-wrap {
                bottom: max(0.4rem, env(safe-area-inset-bottom, 0));
            }
            html:not(.is-logged-in) body.page-home .site-footer-head {
                display: none;
            }
            html.is-logged-in body.page-home .site-footer-head {
                display: block;
            }
            body.page-home .site-footer {
                flex: 0 0 auto;
                font-size: 0.72rem;
                line-height: 1.15;
                padding: 0.35rem 0.75rem max(0.35rem, env(safe-area-inset-bottom, 0));
            }
            body.page-home .site-footer-grid {
                gap: 0.08rem 0;
            }
            body.page-home .site-footer-grid .site-footer-item:nth-child(n + 3) {
                display: none;
            }
            body.page-home .site-footer-item {
                grid-template-columns: 4.5rem minmax(0, 1fr);
                gap: 0.06rem 0.35rem;
            }
        }
        @media (max-width: 430px) and (max-height: 760px) {
            body.page-home .home-intro-copy {
                padding: 0.5rem 0.7rem 0.6rem;
            }
            body.page-home .home-intro-copy .company-hero-stack {
                gap: 0.52rem;
            }
            body.page-home .home-intro-copy .company-hero {
                font-size: clamp(1.32rem, 3.8vw + 0.5rem, 1.62rem);
                line-height: 1.04;
            }
            body.page-home .home-intro-copy .company-taglines p {
                font-size: clamp(0.72rem, 0.9vw + 0.42rem, 0.82rem);
                line-height: 1.28;
                margin: 0 0 0.2rem;
            }
            body.page-home .site-footer {
                font-size: 0.68rem;
                padding-top: 0.28rem;
                padding-bottom: max(0.28rem, env(safe-area-inset-bottom, 0));
            }
        }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body class="page-home">
    <header class="site-header">
        <div class="site-header-start">
            <a href="index.html" class="dz-logo" aria-label="더존 홈"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <div class="nav-dropdown" data-nav-dropdown="support">
                    <a href="support.html" class="header-nav-link nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="supportSubmenu">고객센터</a>
                    <div id="supportSubmenu" class="nav-dropdown-panel" role="menu" aria-label="고객센터 하위 메뉴">
                        <a href="support-partners.html" class="nav-dropdown-item" role="menuitem">파트너회사 소개</a>
                        <a href="support-library.html" class="nav-dropdown-item" role="menuitem">최근소식</a>
                        <a href="support-qna.html" class="nav-dropdown-item" role="menuitem">자유게시판</a>
                        <a href="support-inquiry.html" class="nav-dropdown-item" role="menuitem">문의사항</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="company-main company-main--home">
        <section class="home-intro" aria-label="더존 소개">
            <div class="home-intro-media" aria-hidden="true">
                <video class="home-intro-video" autoplay muted loop playsinline preload="auto">
                    <source src="img/intro.mp4" type="video/mp4">
                </video>
            </div>
            <div class="home-intro-overlay" aria-hidden="true"></div>
            <div class="home-intro-copy">
                <div class="company-hero-stack">
                    <div class="company-hero-wrap">
                        <p class="company-hero" id="homeHeroTitle">믿음을 주는 더존</p>
                    </div>
                    <div class="company-taglines">
                        <p>신선함의 품격, 신뢰의 약속</p>
                        <p>당신의 주방에 품격을 더하다</p>
                        <p>오늘의 최상, 내일의 가치</p>
                    </div>
                </div>
            </div>
            <div class="home-bgm-wrap">
                <p class="home-bgm-hint" id="homeBgmHint" hidden>인트로 영역을 누르거나 아이콘으로 배경음악</p>
                <button type="button" class="home-bgm-toggle" id="homeBgmToggle" aria-label="배경음악 켜기" title="배경음악">
                    <svg class="home-bgm-icon-on" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.06c1.48-.74 2.5-2.26 2.5-4.03zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <svg class="home-bgm-icon-off" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path fill="currentColor" d="M3.27 3L2 4.27l6.01 6.01L7 10v4h4l5 5v-6.73l4.25 4.25 1.41-1.41L3.27 3zM14 3.23v2.06c2.89.86 5 3.54 5 6.71 0 1.02-.31 1.96-.84 2.75L19.73 16c1.48-.74 2.5-2.26 2.5-4.03 0-4.01-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
        </section>
        <audio id="homeBgm" src="img/intro-music.mp3" loop preload="auto" aria-label="인트로 배경음악"></audio>
    </main>

        <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
</div>
    </footer>
    <script src="home-intro-media.js"></script>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                var y = now.getFullYear();
                var m = String(now.getMonth() + 1).padStart(2, "0");
                var d = String(now.getDate()).padStart(2, "0");
                todayEl.dateTime = y + "-" + m + "-" + d;
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            function syncAuthUi() {
                var loggedIn = window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn();
                if (logoutBtn) logoutBtn.hidden = !loggedIn;
                document.documentElement.classList.toggle("is-logged-in", !!loggedIn);
                document.body.classList.toggle("is-logged-in", !!loggedIn);
            }
            function syncHomeHeroTitle() {
                var el = document.getElementById("homeHeroTitle");
                if (!el || !window.THEJHON_AUTH) return;
                if (!el.dataset.heroDefault) {
                    el.dataset.heroDefault = el.textContent.trim();
                }
                var name = "";
                var role = THEJHON_AUTH.getRole ? THEJHON_AUTH.getRole() : "";
                if (THEJHON_AUTH.isLoggedIn()) {
                    if (THEJHON_AUTH.getLoggedInCompanyDisplayName) {
                        name = String(THEJHON_AUTH.getLoggedInCompanyDisplayName() || "").trim();
                    }
                }
                el.textContent = name
                    ? el.dataset.heroDefault.replace(/더존/g, name)
                    : el.dataset.heroDefault;
                if (name) {
                    document.documentElement.classList.add("site-brand-hero-ready");
                    if (role === "admin" || role === "supervisor") {
                        document.title = name;
                    }
                }
                if (window.__thejhonFitHomeHeroTitle) {
                    window.__thejhonFitHomeHeroTitle();
                }
            }
            syncHomeHeroTitle();
            syncAuthUi();
            window.addEventListener("pageshow", syncAuthUi);

            function syncHomeHeaderLogo() {
                var Auth = window.THEJHON_AUTH;
                if (!Auth || !Auth.isLoggedIn || !Auth.isLoggedIn()) return;
                if (Auth.usesStaffLogoRole && Auth.usesStaffLogoRole()) {
                    var logo = Auth.getCachedStaffLogo ? Auth.getCachedStaffLogo() : "";
                    var brand =
                        Auth.getLoggedInCompanyDisplayName && Auth.getLoggedInCompanyDisplayName();
                    if (!brand && Auth.getBrandCompanyDisplayName) {
                        brand = Auth.getBrandCompanyDisplayName();
                    }
                    if (window.__thejhonApplySiteLogo) {
                        window.__thejhonApplySiteLogo(logo, brand || "");
                    }
                    return;
                }
                if (window.__thejhonApplyDefaultBrandedLogo) {
                    window.__thejhonApplyDefaultBrandedLogo("");
                    return;
                }
                if (window.__thejhonApplySiteLogo) {
                    window.__thejhonApplySiteLogo("", "");
                    return;
                }
                document.documentElement.classList.add(
                    "site-brand-active",
                    "site-brand-has-logo",
                    "site-brand-video-ready"
                );
                var imgs = document.querySelectorAll(".dz-logo-img");
                for (var li = 0; li < imgs.length; li++) imgs[li].src = "img/logo.png";
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", syncHomeHeaderLogo);
            } else {
                syncHomeHeaderLogo();
            }
            window.addEventListener("pageshow", syncHomeHeaderLogo);

            if (window.THEJHON_HOME_INTRO_MEDIA && THEJHON_HOME_INTRO_MEDIA.init) {
                THEJHON_HOME_INTRO_MEDIA.init();
            }

            try {
                var sp = new URLSearchParams(window.location.search);
                if (sp.get("denied") === "register") {
                    alert("상품관리·업체관리는 관리자만 이용할 수 있습니다.");
                    history.replaceState({}, "", window.location.pathname);
                }
            } catch (ignore) {}
        })();
    </script>
</body>
</html>
