<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js?v=20260619-public-gate"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>자유게시판 — 고객센터 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="support-pages.css">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="admin-header.js"></script>
    <script src="support-common.js" defer></script>
    <script src="nav.js" defer></script>
    <script src="support-qna.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="index.html" class="dz-logo dz-logo--compact" aria-label="더존 홈"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <div class="nav-dropdown" data-nav-dropdown="support">
                    <a href="support.html" class="header-nav-link nav-dropdown-trigger is-current" aria-haspopup="true" aria-expanded="false" aria-controls="supportSubmenu">고객센터</a>
                    <div id="supportSubmenu" class="nav-dropdown-panel" role="menu" aria-label="고객센터 하위 메뉴">
                        <a href="support-partners.html" class="nav-dropdown-item" role="menuitem">파트너회사 소개</a>
                        <a href="support-library.html" class="nav-dropdown-item" role="menuitem">최근소식</a>
                        <a href="support-qna.html" class="nav-dropdown-item is-current" role="menuitem">자유게시판</a>
                        <a href="support-inquiry.html" class="nav-dropdown-item" role="menuitem">문의사항</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main">
        <p class="company-branch-back"><a href="support.html">← 고객센터</a></p>
        <h1>자유게시판</h1>
        <p id="sq-status" class="sp-status" role="status" aria-live="polite"></p>
        <div class="sq-list-wrap">
            <div class="sq-list-toolbar">
                <span class="sq-list-toolbar__label">게시글</span>
                <button type="button" id="sq-write-btn" class="sp-btn sp-btn--primary">글쓰기</button>
            </div>
            <ul id="sq-list" class="sq-board-list" aria-live="polite"></ul>
        </div>
    </main>
    <div id="sq-write-modal" class="sq-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sq-write-modal-title">
        <div class="sq-modal__panel">
            <div class="sq-modal__head">
                <h2 id="sq-write-modal-title" class="sq-modal__title">글쓰기</h2>
                <button type="button" class="sq-modal__close" id="sq-write-close" aria-label="닫기">×</button>
            </div>
            <form id="sq-form" class="sp-form" novalidate>
                <div class="sp-field">
                    <label for="sq-title">제목</label>
                    <input type="text" id="sq-title" required maxlength="200" autocomplete="off">
                </div>
                <div class="sp-field">
                    <label for="sq-body">내용</label>
                    <textarea id="sq-body" required maxlength="8000" rows="8"></textarea>
                </div>
                <div class="sp-actions">
                    <button type="submit" class="sp-btn sp-btn--primary">등록</button>
                    <button type="button" class="sp-btn sp-btn--secondary" id="sq-write-cancel">취소</button>
                </div>
            </form>
        </div>
    </div>
    <div id="sq-view-modal" class="sq-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sq-view-title">
        <div class="sq-modal__panel sq-modal__panel--view">
            <div class="sq-modal__head">
                <h2 id="sq-view-title" class="sq-modal__title">게시글</h2>
                <button type="button" class="sq-modal__close" id="sq-view-close" aria-label="닫기">×</button>
            </div>
            <div id="sq-view-body"></div>
        </div>
    </div>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                var y = now.getFullYear();
                var m = String(now.getMonth() + 1).padStart(2, "0");
                var d = String(now.getDate()).padStart(2, "0");
                todayEl.dateTime = y + "-" + m + "-" + d;
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            function syncAuthUi() {
                var loggedIn = window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn();
                if (logoutBtn) logoutBtn.hidden = !loggedIn;
            }
            syncAuthUi();
        })();
    </script>
</body>
</html>
