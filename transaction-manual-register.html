<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="public-site-config.js?v=20260620"></script>
    <script src="auth-storage.js?v=20260620-public"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <title>거래명세서 수기 작성 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="admin-manage.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="order-manage-layout.css">
    <link rel="stylesheet" href="transaction-manual-register.css">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="order-ui.js"></script>
    <script src="auth.js?v=20260530-order-nav"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js?v=20260530-order-nav" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--order" aria-label="영업관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar shub-page om-page tmr-page">
        <p class="shub-subnav"><a href="order-manage-hub.html">← 영업관리</a></p>
        <h1>거래명세서 수기 작성</h1>
        <p id="tmr-status" class="tmr-status" role="status" aria-live="polite"></p>

        <form id="tmr-form" class="tmr-panel" novalidate>
            <h2>기본 정보</h2>
            <div class="tmr-grid">
                <div class="tmr-field">
                    <span class="tmr-field-label" id="tmr-issue-date-label">발행일자</span>
                    <div class="tmr-date-pick" role="group" aria-labelledby="tmr-issue-date-label">
                        <select id="tmr-issue-y" aria-label="년" required></select>
                        <select id="tmr-issue-m" aria-label="월" required></select>
                        <select id="tmr-issue-d" aria-label="일" required></select>
                    </div>
                </div>
                <div class="tmr-field tmr-field-issuer" id="tmr-issuer-wrap">
                    <label for="tmr-issuer">공급자 (발행 관리자·인감)</label>
                    <select id="tmr-issuer" name="issuerStaffLoginId" required>
                        <option value="">관리자 선택</option>
                    </select>
                    <p class="tmr-field-note" id="tmr-issuer-note">선택한 관리자가 등록한 상품·인감으로 발행합니다.</p>
                </div>
                <div class="tmr-field tmr-field--full">
                    <label for="tmr-title">메모 (선택)</label>
                    <input type="text" id="tmr-title" name="title" maxlength="120" placeholder="저장 목록에 표시할 제목">
                </div>
            </div>

            <h2 style="margin-top:1.25rem">거래처 (공급받는 자)</h2>
            <div class="tmr-grid">
                <div class="tmr-field">
                    <label for="tmr-vendor-company">거래처(업체명)</label>
                    <div class="tmr-vendor-pick">
                        <input type="text" id="tmr-vendor-company" name="vendorCompany" required maxlength="200" readonly placeholder="업체 선택">
                        <button type="button" class="btn btn-secondary" id="tmr-btn-vendor-pick">업체 선택</button>
                    </div>
                </div>
                <div class="tmr-field">
                    <label for="tmr-vendor-ceo">대표자명</label>
                    <input type="text" id="tmr-vendor-ceo" name="vendorCeo" maxlength="80">
                </div>
                <div class="tmr-field tmr-field--full">
                    <label for="tmr-vendor-addr">주소</label>
                    <input type="text" id="tmr-vendor-addr" name="vendorAddr" maxlength="300">
                </div>
                <div class="tmr-field">
                    <label for="tmr-vendor-phone">전화번호</label>
                    <input type="tel" id="tmr-vendor-phone" name="vendorPhone" maxlength="30">
                </div>
            </div>

            <h2 style="margin-top:1.25rem">품목 (최대 10행)</h2>
            <p class="tmr-items-hint" id="tmr-items-hint">품목코드·품명 입력란을 누르면 등록 상품 목록에서 선택할 수 있습니다.</p>
            <div class="tmr-field tmr-field--full tmr-items-section">
                <div class="tmr-items-wrap">
                <table class="tmr-items-table" aria-label="거래명세 품목">
                    <thead>
                        <tr>
                            <th class="tmr-col-code">품목코드</th>
                            <th class="tmr-col-name">품명</th>
                            <th class="tmr-col-size">규격</th>
                            <th class="tmr-col-qty">수량</th>
                            <th class="tmr-col-price">단가</th>
                            <th class="tmr-col-line">공급가액</th>
                            <th class="tmr-col-act"></th>
                        </tr>
                    </thead>
                    <tbody id="tmr-items-body"></tbody>
                </table>
                </div>
                <div class="tmr-items-foot">
                    <button type="button" class="btn btn-secondary" id="tmr-add-row">품목 행 추가</button>
                    <span class="tmr-total" id="tmr-total-label">합계 0원</span>
                </div>
            </div>

            <div class="tmr-field tmr-field--full" style="margin-top:0.75rem">
                <label for="tmr-note">비고</label>
                <textarea id="tmr-note" name="note" rows="2" maxlength="500"></textarea>
            </div>

            <div class="tmr-actions">
                <button type="button" class="btn btn-secondary" id="tmr-btn-new">새로 작성</button>
                <button type="button" class="btn btn-secondary" id="tmr-btn-preview">PDF 미리보기</button>
                <button type="button" class="btn btn-primary" id="tmr-btn-save">저장</button>
                <button type="button" class="btn btn-primary" id="tmr-btn-pdf" hidden>PDF 저장</button>
                <button type="button" class="btn btn-secondary tmr-btn--danger" id="tmr-btn-delete" hidden>삭제</button>
            </div>
        </form>

        <section class="tmr-panel" aria-labelledby="tmr-saved-title">
            <h2 id="tmr-saved-title">저장된 수기 거래명세서</h2>
            <ul id="tmr-saved-list" class="tmr-saved-list"></ul>
        </section>
    </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <div id="tmr-product-modal" class="tmr-picker-modal" hidden role="dialog" aria-modal="true" aria-labelledby="tmr-product-modal-title">
        <div class="tmr-picker-panel">
            <h2 id="tmr-product-modal-title" class="tmr-picker-title">등록 상품 선택</h2>
            <p class="tmr-picker-hint">관리자가 등록한 상품에서 선택합니다. 코드·품명으로 검색하세요.</p>
            <label for="tmr-product-search" class="sr-only">상품 검색</label>
            <input type="search" id="tmr-product-search" class="tmr-picker-search" placeholder="품목코드·품명 검색" autocomplete="off">
            <ul id="tmr-product-list" class="tmr-picker-list"></ul>
            <div class="tmr-picker-actions">
                <button type="button" class="btn" id="tmr-product-modal-close">닫기</button>
            </div>
        </div>
    </div>
    <div id="tmr-vendor-modal" class="tmr-picker-modal" hidden role="dialog" aria-modal="true" aria-labelledby="tmr-vendor-modal-title">
        <div class="tmr-picker-panel">
            <h2 id="tmr-vendor-modal-title" class="tmr-picker-title">등록 업체 선택</h2>
            <p class="tmr-picker-hint">관리자가 등록한 업체명에서 선택합니다. 검색 후 항목을 누르세요.</p>
            <label for="tmr-vendor-search" class="sr-only">업체 검색</label>
            <input type="search" id="tmr-vendor-search" class="tmr-picker-search" placeholder="업체명 검색" autocomplete="off">
            <ul id="tmr-vendor-list" class="tmr-picker-list"></ul>
            <div class="tmr-picker-actions">
                <button type="button" class="btn" id="tmr-vendor-modal-close">닫기</button>
            </div>
        </div>
    </div>
    <script src="address-fields.js"></script>
    <script src="qty-stepper.js"></script>
    <script src="transaction-manual-register.js"></script>
</body>
</html>
