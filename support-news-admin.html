<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>최근소식 입력 — 고객센터 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="support-pages.css">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="product-catalog.js"></script>
    <script src="product-form-shared.js"></script>
    <script src="support-news-shared.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
    <script src="support-news-admin.js" defer></script>
</head>
<body>
    <script>
        (function () {
            var A = window.THEJHON_AUTH;
            if (!A || !A.canManageRegisters || !A.canManageRegisters()) {
                window.location.replace("support.html");
            }
        })();
    </script>
    <header class="site-header">
        <div class="site-header-start">
            <a href="index.html" class="dz-logo dz-logo--compact" aria-label="더존 홈"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <div class="nav-dropdown" data-nav-dropdown="support">
                    <a href="support.html" class="header-nav-link nav-dropdown-trigger is-current" aria-haspopup="true" aria-expanded="false" aria-controls="supportSubmenu">고객센터</a>
                    <div id="supportSubmenu" class="nav-dropdown-panel" role="menu" aria-label="고객센터 하위 메뉴">
                        <a href="support-partners.html" class="nav-dropdown-item" role="menuitem">파트너회사 소개</a>
                        <a href="support-library.html" class="nav-dropdown-item" role="menuitem">최근소식</a>
                        <a href="support-qna.html" class="nav-dropdown-item" role="menuitem">자유게시판</a>
                        <a href="support-inquiry.html" class="nav-dropdown-item" role="menuitem">문의사항</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main">
        <p class="company-branch-back"><a href="support.html">← 고객센터</a></p>
        <h1>최근소식 입력</h1>
        <p class="sp-lead">모든 관리자가 소식을 등록할 수 있습니다. 저장된 내용은 <a href="support-library.html">최근소식</a> 화면에 공개됩니다.</p>
        <p id="sna-status" class="sp-status" role="status" aria-live="polite"></p>
        <section class="sp-panel">
            <h2 class="sp-subheading">소식 등록</h2>
            <form id="sna-form" class="sp-form" novalidate>
                <input type="hidden" id="sna-edit-id" value="">
                <input type="hidden" id="sna-dept" value="">
                <div class="sp-field">
                    <label for="sna-dept-display">제목 (사업부문)</label>
                    <input type="text" id="sna-dept-display" class="sn-dept-input" readonly placeholder="클릭하여 사업부문 선택" autocomplete="off" aria-haspopup="dialog">
                </div>
                <div class="sn-photos">
                    <p class="sn-photos-hint">사진 1~3장 (각 1MB 이하, 1:1 자동 조정)</p>
                    <div id="sna-photo-slots" class="sn-photo-slots" aria-live="polite"></div>
                    <input type="file" id="sna-gallery" accept="image/*,.heic,.heif" hidden>
                    <input type="file" id="sna-camera" accept="image/*" capture="environment" hidden>
                    <div class="sn-photo-btns">
                        <button type="button" id="sna-btn-gallery" class="sp-btn sp-btn--secondary">앨범/파일</button>
                        <button type="button" id="sna-btn-camera" class="sp-btn sp-btn--secondary">카메라</button>
                    </div>
                </div>
                <div class="sp-field">
                    <label for="sna-body">내용</label>
                    <textarea id="sna-body" required maxlength="256" rows="4" placeholder="최대 256자"></textarea>
                    <p id="sna-char-count" class="sn-char-count">0 / 256</p>
                </div>
                <div class="sp-actions">
                    <button type="submit" class="sp-btn sp-btn--primary" id="sna-submit">등록</button>
                    <button type="button" id="sna-cancel" class="sp-btn sp-btn--secondary" hidden>편집 취소</button>
                </div>
            </form>
        </section>
        <h2 class="sp-subheading" style="max-width: min(100%, 42rem); margin: 1.25rem auto 0.65rem">등록된 소식</h2>
        <ul id="sna-list" class="sn-admin-list" aria-live="polite"></ul>
    </main>
    <div id="sn-dept-modal" class="sn-dept-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sn-dept-modal-title">
        <div class="sn-dept-modal__panel">
            <h2 id="sn-dept-modal-title" class="sn-dept-modal__title">사업부문 선택</h2>
            <div id="sn-dept-modal-btns" class="sn-dept-modal__btns"></div>
            <button type="button" class="sn-dept-modal__close">닫기</button>
        </div>
    </div>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                var y = now.getFullYear();
                var m = String(now.getMonth() + 1).padStart(2, "0");
                var d = String(now.getDate()).padStart(2, "0");
                todayEl.dateTime = y + "-" + m + "-" + d;
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            function syncAuthUi() {
                var loggedIn = window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn();
                if (logoutBtn) logoutBtn.hidden = !loggedIn;
            }
            syncAuthUi();
        })();
    </script>
</body>
</html>
