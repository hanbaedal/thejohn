<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최근소식 입력 — 고객센터 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="support-pages.css">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="admin-header.js"></script>
    <script src="support-common.js" defer></script>
    <script src="nav.js" defer></script>
    <script src="support-news-admin.js" defer></script>
</head>
<body>
    <script>
        (function () {
            var A = window.THEJHON_AUTH;
            if (!A || !A.canManageRegisters || !A.canManageRegisters()) {
                window.location.replace("support.html");
            }
        })();
    </script>
    <header class="site-header">
        <div class="site-header-start">
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <div class="nav-dropdown" data-nav-dropdown="support">
                    <a href="support.html" class="header-nav-link nav-dropdown-trigger is-current" aria-haspopup="true" aria-expanded="false" aria-controls="supportSubmenu">고객센터</a>
                    <div id="supportSubmenu" class="nav-dropdown-panel" role="menu" aria-label="고객센터 하위 메뉴">
                        <a href="support-partners.html" class="nav-dropdown-item" role="menuitem">파트너회사 소개</a>
                        <a href="support-library.html" class="nav-dropdown-item" role="menuitem">최근소식</a>
                        <a href="support-qna.html" class="nav-dropdown-item" role="menuitem">자유게시판</a>
                        <a href="support-inquiry.html" class="nav-dropdown-item" role="menuitem">문의사항</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main">
        <p class="company-branch-back"><a href="support.html">← 고객센터</a></p>
        <h1>최근소식 입력</h1>
        <p class="sp-lead">아래에서 소식을 등록·수정·삭제합니다. 저장된 내용은 <a href="support-library.html">최근소식</a> 화면과 동일한 목록으로 공개됩니다.</p>
        <p id="sna-status" class="sp-status" role="status" aria-live="polite"></p>
        <section class="sp-panel">
            <h2 class="sp-subheading">소식 등록</h2>
            <form id="sna-form" class="sp-form" novalidate>
                <input type="hidden" id="sna-edit-id" value="">
                <div class="sp-field">
                    <label for="sna-title">제목</label>
                    <input type="text" id="sna-title" required maxlength="200" autocomplete="off">
                </div>
                <div class="sp-field">
                    <label for="sna-body">내용</label>
                    <textarea id="sna-body" required maxlength="12000" rows="8"></textarea>
                </div>
                <div class="sp-actions">
                    <button type="submit" class="sp-btn sp-btn--primary">저장</button>
                    <button type="button" id="sna-cancel" class="sp-btn sp-btn--secondary" hidden>편집 취소</button>
                </div>
            </form>
        </section>
        <h2 class="sp-subheading" style="max-width: min(100%, 42rem); margin: 1.25rem auto 0.65rem">등록된 소식</h2>
        <div id="sna-list" class="sp-list" aria-live="polite"></div>
    </main>
        <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
</div>
    </footer>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                var y = now.getFullYear();
                var m = String(now.getMonth() + 1).padStart(2, "0");
                var d = String(now.getDate()).padStart(2, "0");
                todayEl.dateTime = y + "-" + m + "-" + d;
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            function syncAuthUi() {
                var loggedIn = window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn();
                if (logoutBtn) logoutBtn.hidden = !loggedIn;
            }
            if (logoutBtn) {
                logoutBtn.addEventListener("click", function () {
                    if (window.THEJHON_AUTH) THEJHON_AUTH.clearSession();
                    location.reload();
                });
            }
            syncAuthUi();
        })();
    </script>
</body>
</html>
