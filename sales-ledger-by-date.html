<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="public-site-config.js?v=20260620"></script>
    <script src="auth-storage.js?v=20260620-public"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <title>일자별 매출장 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="order-list-filters.css">
    <link rel="stylesheet" href="order-manage-layout.css">
    <link rel="stylesheet" href="sales-report.css">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="order-ui.js"></script>
    <script src="auth.js?v=20260617-order-subnav"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js?v=20260530-order-nav" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--order" aria-label="영업관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar shub-page om-page srp-page">
        <p class="shub-subnav"><a href="sales-ledger-hub.html">← 매출장</a> · <a href="order-manage-hub.html">영업관리</a></p>
        <h1>일자별 매출장</h1>
        <p class="srp-hint">기간 내 거래명세서(주문·수기) 매출을 일자별·품목별로 조회합니다.</p>
        <p id="slp-status" class="shub-status" role="status" aria-live="polite"></p>
        <div class="ol-query-filters" aria-label="매출장 조회 조건">
            <section class="ol-query-filters__section" aria-labelledby="slp-filter-period-heading">
                <h2 id="slp-filter-period-heading" class="ol-query-filters__heading">조회 기간</h2>
                <div class="ol-query-filters__row">
                    <label for="slp-date-from">시작일</label>
                    <input type="date" id="slp-date-from">
                </div>
                <div class="ol-query-filters__row">
                    <label for="slp-date-to">종료일</label>
                    <input type="date" id="slp-date-to">
                </div>
            </section>
            <section class="ol-query-filters__section" id="slp-admin-wrap" hidden aria-labelledby="slp-filter-admin-heading">
                <h2 id="slp-filter-admin-heading" class="ol-query-filters__heading">담당 관리자</h2>
                <div class="ol-query-filters__row"><label for="slp-admin">관리자</label><select id="slp-admin"><option value="">전체</option></select></div>
            </section>
        </div>
        <div class="srp-toolbar">
            <button type="button" class="btn btn-primary" id="slp-btn-search">조회</button>
            <button type="button" class="btn btn-secondary" id="slp-btn-pdf" disabled>PDF 저장</button>
            <button type="button" class="btn btn-secondary" id="slp-btn-print" disabled>출력</button>
        </div>
        <div class="srp-results-wrap" id="slp-print-area">
            <div class="srp-ledger-sheet" id="slp-ledger-sheet" hidden>
                <header class="srp-ledger-sheet__head">
                    <h2 id="slp-print-title" class="srp-ledger-sheet__title"></h2>
                    <p id="slp-print-period" class="srp-ledger-sheet__meta"></p>
                    <p id="slp-summary" class="srp-ledger-sheet__meta srp-ledger-sheet__summary" hidden></p>
                </header>
                <div class="srp-table-wrap srp-table-wrap--inset">
                    <table class="srp-table srp-table--date-ledger" aria-label="일자별 매출장">
                        <colgroup>
                            <col class="col-date">
                            <col class="col-vendor">
                            <col class="col-code">
                            <col class="col-name">
                            <col class="col-qty">
                            <col class="col-price">
                            <col class="col-amount">
                        </colgroup>
                        <thead>
                            <tr>
                                <th scope="col">일자</th>
                                <th scope="col">업체</th>
                                <th scope="col">코드</th>
                                <th scope="col">품명</th>
                                <th scope="col" class="num">수량</th>
                                <th scope="col" class="num">단가</th>
                                <th scope="col" class="num">소계</th>
                            </tr>
                        </thead>
                        <tbody id="slp-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script>window.SALES_LEDGER_PAGE_CONFIG={mode:"date",title:"일자별 매출장",pdfPrefix:"매출장_일자"};</script>
    <script src="sales-report-shared.js"></script>
    <script src="sales-ledger-page.js"></script>
</body>
</html>
