<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="public-site-config.js?v=20260620"></script>
    <script src="auth-storage.js?v=20260620-public"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>신규업체 리스트 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="admin-manage.css">
    <link rel="stylesheet" href="vendor-prospect-region.css?v=20260722">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="staff-vendor-boot.js"></script>
    <script src="admin-header.js"></script>
    <script src="product-catalog.js"></script>
    <script src="product-form-shared.js"></script>
    <script src="vendor-admin-shared.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--vendor" aria-label="업체관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar">
        <p class="am-subnav"><a href="vendor-manage.html">← 업체관리</a> · <a href="vendor-new-register.html">신규업체 등록</a></p>
        <h1>신규업체 리스트</h1>
        <p id="vl-status" class="vl-status" role="status" aria-live="polite"></p>
        <div id="vl-staff-filter-wrap" class="am-filter-bar" hidden>
            <label for="vl-staff-filter" class="am-dept-caption">등록 담당</label>
            <select id="vl-staff-filter" class="vr-select" style="max-width:18rem">
                <option value="all">전체 관리자</option>
            </select>
        </div>
        <div class="am-filter-bar am-dept-picker">
            <span class="am-dept-caption">사업부문 선택</span>
            <input type="hidden" id="vl-filter-dept" value="">
            <div id="vl-dept-filter" class="am-dept-picker-btns"></div>
        </div>
        <div id="vl-list" class="vpr-grid vpr-grid--vendor-list" aria-live="polite"></div>
    </main>
        <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
</div>
    </footer>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                todayEl.dateTime = now.toISOString().slice(0, 10);
                todayEl.textContent = now.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
            }
            var logoutBtn = document.getElementById("btnLogout");
            if (logoutBtn) {logoutBtn.hidden = !(window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn());
            }
        })();
    </script>
    <script src="vendor-list-cards.js?v=20260722"></script>
    <script src="vendor-new-list.js"></script>
</body>
</html>
