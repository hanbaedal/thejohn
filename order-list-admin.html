<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icon-192.png" sizes="192x192" type="image/png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <link rel="apple-touch-icon" sizes="192x192" href="img/icon-192.png">

    <title>주문서관리 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="admin-manage.css">
    <style>
        .ol-admin-list { list-style: none; margin: 0; padding: 0; }
        .ol-list-scroll {
            max-height: 19rem;
            overflow-y: auto;
            padding-right: 0.2rem;
        }
        .ol-admin-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem 1rem;
            padding: 0.85rem 1rem;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: #fff;
        }
        .ol-admin-main { flex: 1; min-width: 12rem; }
        .ol-admin-name { display: block; font-weight: 700; color: #052a4d; }
        .ol-admin-meta { font-size: 0.85rem; color: #5a6d7e; }
        .ol-admin-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
        .ol-admin-actions .btn { font-size: 0.8rem; padding: 0.3rem 0.65rem; }
        .ol-status { margin: 0 0 1rem; font-size: 0.85rem; color: #3d5166; min-height: 1.25rem; }
        .ol-hint {
            margin: 0 0 1rem;
            padding: 0.65rem 0.85rem;
            background: #f4f8fc;
            border: 1px solid #d4e2f0;
            border-radius: 8px;
            font-size: 0.88rem;
            color: #3d556d;
        }
        .ol-admin-item { cursor: pointer; }
        .ol-admin-item.is-selected {
            border-color: var(--dz-blue, #0a4d9c);
            box-shadow: 0 0 0 2px rgba(10, 77, 156, 0.15);
        }
        .ol-admin-item:focus-visible { outline: 2px solid var(--dz-blue, #0a4d9c); outline-offset: 2px; }
        #ol-detail {
            margin-top: 1.25rem;
            padding: 1rem 1.1rem;
            background: #f8fafc;
            border: 1px solid #d4e2f0;
            border-radius: 12px;
        }
        #ol-detail[hidden] { display: none !important; }
        .ol-detail-title { margin: 0 0 0.75rem; font-size: 1.1rem; color: #052a4d; }
        .ol-detail-loading { margin: 0; color: #3d5166; }
        .ol-detail-actions { margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .order-detail-meta {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.3rem 1rem;
            margin: 0 0 1rem;
            font-size: 0.92rem;
        }
        .order-detail-meta dt { font-weight: 700; color: #2a4a5e; margin: 0; }
        .order-detail-meta dd { margin: 0; }
        .order-detail-table-wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
        }
        .order-detail-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        .order-detail-table th,
        .order-detail-table td {
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid #e8edf2;
            text-align: left;
        }
        .order-detail-table th { background: #f4f7fb; }
        .order-detail-total { margin: 0.75rem 0 0; text-align: right; font-size: 1rem; }
        .order-detail-empty { margin: 0; color: #5a6d7e; }
        .ol-date-input { min-width: 10rem; }
        .ol-vendor-input { min-width: 14rem; cursor: pointer; background: #fff; }
        .ol-filter-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.45rem 0.6rem;
            margin-bottom: 0.55rem;
        }
        .ol-filter-row--vendor {
            justify-content: space-between;
        }
        .ol-filter-left {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            min-width: 0;
        }
        .ol-filter-actions {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-left: auto;
        }
        .ol-picker-modal {
            position: fixed;
            inset: 0;
            z-index: 10020;
            background: rgba(5, 42, 77, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .ol-picker-modal[hidden] { display: none !important; }
        .ol-picker-panel {
            width: min(100%, 34rem);
            max-height: min(80vh, 44rem);
            background: #fff;
            border-radius: 12px;
            padding: 0.95rem;
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .ol-picker-list {
            margin: 0;
            padding: 0;
            list-style: none;
            overflow-y: auto;
            max-height: 45vh;
            border: 1px solid #e5ebf2;
            border-radius: 8px;
        }
        .ol-picker-item-btn {
            width: 100%;
            border: none;
            background: #fff;
            text-align: left;
            padding: 0.55rem 0.7rem;
            border-bottom: 1px solid #edf2f7;
            cursor: pointer;
            font: inherit;
        }
        .ol-picker-item-btn:hover { background: #f7fbff; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="order-ui.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="index.html" class="dz-logo dz-logo--compact" aria-label="더존 홈"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <div class="nav-dropdown" data-nav-dropdown="support">
                    <a href="support.html" class="header-nav-link nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="supportSubmenu">고객센터</a>
                    <div id="supportSubmenu" class="nav-dropdown-panel" role="menu" aria-label="고객센터 하위 메뉴">
                        <a href="support-partners.html" class="nav-dropdown-item" role="menuitem">파트너회사 소개</a>
                        <a href="support-library.html" class="nav-dropdown-item" role="menuitem">최근소식</a>
                        <a href="support-qna.html" class="nav-dropdown-item" role="menuitem">자유게시판</a>
                        <a href="support-inquiry.html" class="nav-dropdown-item" role="menuitem">문의사항</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar">
        <p class="am-subnav"><a href="vendor-manage.html">← 업체관리</a></p>
        <h1>주문서관리</h1>
        <p id="ol-hint" class="ol-hint" hidden></p>
        <p id="ol-status" class="ol-status" role="status" aria-live="polite"></p>
        <div class="ol-filter-row ol-filter-row--vendor">
            <div class="ol-filter-left">
                <strong>등록업체로 조회</strong>
                <label for="ol-vendor-name" class="sr-only">등록업체 선택</label>
                <input type="text" id="ol-vendor-name" class="ol-vendor-input" placeholder="선택된 업체 없음" readonly>
            </div>
            <div class="ol-filter-actions">
                <button type="button" class="btn" id="ol-vendor-pick-btn">업체선택</button>
                <button type="button" class="btn" id="ol-vendor-clear-btn">업체해제</button>
            </div>
        </div>
        <div class="ol-filter-row">
            <strong>기간으로 조회</strong>
            <label for="ol-date-from">시작일</label>
            <input type="date" id="ol-date-from" class="ol-date-input">
            <label for="ol-date-to">종료일</label>
            <input type="date" id="ol-date-to" class="ol-date-input">
        </div>
        <div id="ol-list" class="ol-list-scroll"></div>
        <div id="ol-detail" hidden aria-live="polite"></div>
        <div id="ol-vendor-modal" class="ol-picker-modal" hidden role="dialog" aria-modal="true" aria-labelledby="ol-vendor-modal-title">
            <div class="ol-picker-panel">
                <h2 id="ol-vendor-modal-title" class="ol-detail-title">업체 선택</h2>
                <label for="ol-vendor-search" class="sr-only">업체 검색</label>
                <input type="text" id="ol-vendor-search" placeholder="업체명 검색">
                <ul id="ol-vendor-list" class="ol-picker-list"></ul>
                <div class="vei-actions">
                    <button type="button" class="btn" id="ol-vendor-modal-close">닫기</button>
                </div>
            </div>
        </div>
    </main>
        <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
</div>
    </footer>
    <script src="order-list-admin.js"></script>
</body>
</html>
