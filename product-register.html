<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>상품 내용 등록 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="admin-manage.css">
    <link rel="stylesheet" href="vendor-form-page.css">
    <link rel="stylesheet" href="product-photo-gallery.css">
    <style>
        .pr-form { margin: 0 auto 2rem; padding: 1.25rem 1.1rem; background: #fff; border: 1px solid #e0e6ed; border-radius: 10px; box-shadow: 0 2px 12px rgba(10, 77, 156, 0.06); }
        .pr-field { margin-bottom: 1rem; }
        .pr-field label { display: block; font-size: 0.8rem; font-weight: 600; color: #3d5166; margin-bottom: 0.35rem; }
        .pr-field input[type="text"],
        .pr-field input[type="number"],
        .pr-field select,
        .pr-field textarea { width: 100%; padding: 0.6rem 0.7rem; font-size: 1rem; font-family: inherit; border: 1px solid #c5d0dc; border-radius: 6px; }
        .pr-field select:disabled { background: #f4f6f9; color: #8a9bab; }
        .pr-field-row { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; align-items: flex-end; margin-bottom: 1rem; }
        .pr-field-row.pr-row--2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem 0.75rem; }
        .pr-field-row.pr-row--name { display: grid; grid-template-columns: minmax(9.5rem, 11.5rem) minmax(0, 1fr); gap: 0.5rem 0.75rem; align-items: start; margin-bottom: 1rem; }
        .pr-field-row.pr-row--name .pr-field-code,
        .pr-field-row.pr-row--name .pr-field-name-wrap { min-width: 0; margin-bottom: 0; }
        .pr-field-row.pr-row--name label { display: block; font-size: 0.8rem; font-weight: 600; color: #3d5166; margin-bottom: 0.35rem; }
        .pr-field-row.pr-row--name input { width: 100%; padding: 0.6rem 0.7rem; font-size: 1rem; font-family: inherit; border: 1px solid #c5d0dc; border-radius: 6px; box-sizing: border-box; }
        .pr-field-row.pr-row--name input:focus { outline: none; border-color: var(--dz-blue); box-shadow: 0 0 0 2px rgba(10, 77, 156, 0.2); }
        .pr-field-row.pr-row--4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.5rem 0.65rem; }
        @media (min-width: 641px) and (max-width: 720px) {
            .pr-field-row.pr-row--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (min-width: 641px) {
            .pr-field-row .pr-field-half { flex: 1 1 10rem; min-width: 0; margin-bottom: 0; }
        }
        .pr-field-row .pr-field-half { min-width: 0; margin-bottom: 0; }
        .pr-price-group { margin-bottom: 1rem; }
        .pr-price-group > .pr-price-caption { display: block; font-size: 0.8rem; font-weight: 600; color: #3d5166; margin-bottom: 0.4rem; }
        .pr-price-list { display: flex; flex-wrap: wrap; gap: 0.35rem 0.5rem; font-size: 0.88rem; color: var(--dz-blue); font-weight: 600; }
        .pr-field-row .pr-field-half label { display: block; font-size: 0.8rem; font-weight: 600; color: #3d5166; margin-bottom: 0.35rem; }
        .pr-field-row .pr-field-half input { width: 100%; padding: 0.6rem 0.7rem; font-size: 1rem; font-family: inherit; border: 1px solid #c5d0dc; border-radius: 6px; }
        .pr-field-row .pr-field-half input:focus { outline: none; border-color: var(--dz-blue); box-shadow: 0 0 0 2px rgba(10, 77, 156, 0.2); }
        .pr-field input:focus, .pr-field textarea:focus { outline: none; border-color: var(--dz-blue); box-shadow: 0 0 0 2px rgba(10, 77, 156, 0.2); }
        .pr-field input[type="file"] { font-size: 0.875rem; }
        .pr-hint { margin: 0.35rem 0 0; font-size: 0.75rem; color: #6b7c8e; }
        .pr-photo-preview { display: block; width: 7.5rem; height: 7.5rem; margin-top: 0.5rem; border-radius: 6px; border: 1px solid #e0e6ed; object-fit: cover; background: #f8fafc; }
        .pr-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.1rem; }
        .pr-actions .btn { border: 2px solid var(--dz-blue); background: #fff; color: var(--dz-blue); padding: 0.45rem 1rem; font-size: 0.875rem; font-weight: 600; border-radius: 6px; cursor: pointer; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .pr-actions .btn-primary { background: var(--dz-blue); color: #fff; }
        .pr-actions .btn-secondary { border-color: #c5d0dc; color: #3d5166; background: #f4f6f9; }
        .pr-status { margin: 0 0 1rem; font-size: 0.85rem; color: #3d5166; min-height: 1.25rem; }
        .pr-list { max-width: 42rem; margin: 0 auto; }
        .pr-list h2 { font-size: 1.1rem; margin: 0 0 0.75rem; color: #1a2b3c; }
        .pr-card { background: #fff; border: 1px solid #e0e6ed; border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 0.85rem; box-shadow: 0 1px 6px rgba(10, 77, 156, 0.05); }
        .pr-card-head { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
        .pr-card-img { width: 6.5rem; height: 6.5rem; object-fit: cover; border-radius: 6px; border: 1px solid #e0e6ed; flex-shrink: 0; background: #f4f6f9; }
        .pr-card-img--empty { display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #8a9bab; text-align: center; padding: 0.35rem; }
        .pr-card-body { flex: 1; min-width: 0; }
        .pr-card-title { margin: 0 0 0.35rem; font-size: 1.05rem; font-weight: 700; color: #052a4d; }
        .pr-card-price { margin: 0 0 0.5rem; font-size: 0.95rem; font-weight: 600; color: var(--dz-blue); display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.35rem 0.75rem; }
        .pr-card-spec { font-weight: 600; color: #3d556d; font-size: 0.88rem; }
        .pr-card-content { margin: 0; font-size: 0.9rem; line-height: 1.55; color: #3d5166; white-space: pre-wrap; word-break: break-word; }
        .pr-card-contact { margin: 0.35rem 0 0; font-size: 0.82rem; color: #5a6d80; }
        .pr-card-actions { margin-top: 0.75rem; display: flex; gap: 0.45rem; flex-wrap: wrap; }
        .pr-card-actions button { font-size: 0.8125rem; padding: 0.35rem 0.65rem; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 600; border: 1px solid #c5d0dc; background: #fff; color: #3d5166; }
        .pr-card-actions button.pr-btn-del { border-color: #e8a4a4; color: #a12c2c; background: #fff8f8; }
    </style>
    <link rel="stylesheet" href="product-form-page.css">
    <link rel="stylesheet" href="product-info-modal.css">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <link rel="stylesheet" href="staff-hub.css">
    <script src="auth.js?v=20260530-product-nav"></script>
    <script src="admin-header.js"></script>
    <script src="product-catalog.js"></script>
    <script src="product-form-shared.js"></script>
    <script src="nav.js?v=20260530-product-nav" defer></script>
    <script src="staff-product-boot.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--product" aria-label="상품관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar pr-form-page-wrap">
        <p class="am-subnav"><a href="product-manage.html">← 상품관리</a></p>
        <h1>상품 내용 등록</h1>
        <p id="pr-registrar-hint" class="pr-hint" hidden></p>
        <p id="pr-status" class="pr-status" role="status" aria-live="polite"></p>
        <form id="pr-form" class="pr-form pr-form-page" novalidate>
            <div class="pr-section-block pr-section-block--first pr-section-block--core">
                <div class="vr-dept-row pr-dept-row">
                    <div class="vr-dept-line">
                        <span class="vr-dept-caption" id="pr-dept-label">사업부문</span>
                        <p class="vr-dept-summary vr-dept-summary--empty" id="pr-dept-summary" aria-live="polite"></p>
                        <button type="button" class="btn btn-secondary vr-dept-open-btn" id="pr-dept-open" aria-labelledby="pr-dept-label">선택</button>
                    </div>
                    <input type="hidden" id="pr-pd-dept" name="pd_dept" value="">
                </div>
                <div class="pr-field-row pr-row--name">
                    <div class="pr-field-code">
                        <label for="pr-pd-code">상품 코드</label>
                        <input type="text" id="pr-pd-code" name="pd_code" maxlength="16" autocomplete="off" placeholder="16자 이내" inputmode="text" aria-describedby="pr-code-dup-hint">
                        <p id="pr-code-dup-hint" class="pr-name-dup-hint pr-name-dup-hint--idle" hidden></p>
                    </div>
                    <div class="pr-field-name-wrap">
                        <label for="pr-pd-name">상품 명칭</label>
                        <input type="text" id="pr-pd-name" name="pd_name" required maxlength="200" autocomplete="off" placeholder="상품 명칭" aria-describedby="pr-name-dup-hint">
                        <p id="pr-name-dup-hint" class="pr-name-dup-hint pr-name-dup-hint--idle" hidden></p>
                    </div>
                </div>
                <div class="pr-field-row pr-row--price-size">
                    <div class="pr-field-half">
                        <label for="pr-pd-price1">가격 1</label>
                        <input type="number" id="pr-pd-price1" name="pd_price1" min="0" step="1" inputmode="numeric" placeholder="0">
                    </div>
                    <div class="pr-field-half">
                        <label for="pr-pd-price2">가격 2</label>
                        <input type="number" id="pr-pd-price2" name="pd_price2" min="0" step="1" inputmode="numeric" placeholder="0">
                    </div>
                    <div class="pr-field-half">
                        <label for="pr-pd-price3">가격 3</label>
                        <input type="number" id="pr-pd-price3" name="pd_price3" min="0" step="1" inputmode="numeric" placeholder="0">
                    </div>
                    <div class="pr-field-half">
                        <label for="pr-pd-price4">구매가</label>
                        <input type="number" id="pr-pd-price4" name="pd_price4" min="0" step="1" inputmode="numeric" placeholder="0">
                    </div>
                    <div class="pr-field-half pr-field-size">
                        <label for="pr-pd-size">상품 규격</label>
                        <input type="text" id="pr-pd-size" name="pd_size" maxlength="120" autocomplete="off" placeholder="예: 500g, 1박스 20입">
                    </div>
                </div>
                <div class="pr-divider pr-divider--core" role="separator" aria-hidden="true"></div>
                <div class="pr-field pr-pinfo-field">
                    <span class="pr-pinfo-caption" id="pr-pinfo-label">상품 필수 정보</span>
                    <button type="button" class="btn btn-secondary pr-btn-pinfo" id="pr-btn-product-info" aria-labelledby="pr-pinfo-label">정보등록</button>
                </div>
            </div>
            <div class="pr-divider" role="separator" aria-hidden="true"></div>

            <div class="pr-section-block pr-photo-field">
                <div class="pr-photo-toolbar">
                    <span class="pr-photo-label" id="pr-photo-label">상품 사진</span>
                    <input type="file" id="pr-pd-image-gallery" class="pr-photo-file-input" name="pd_image_gallery" accept="image/*,.heic,.heif">
                    <input type="file" id="pr-pd-image-camera" class="pr-photo-file-input" name="pd_image_camera" accept="image/*" capture="environment">
                    <div class="pr-photo-icon-actions" role="group" aria-labelledby="pr-photo-label">
                        <button type="button" class="pr-photo-icon-btn" id="pr-photo-gallery-btn" aria-label="앨범·파일에서 선택" title="앨범·파일에서 선택">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                        </button>
                        <button type="button" class="pr-photo-icon-btn pr-photo-icon-btn--camera" id="pr-photo-camera-btn" aria-label="카메라로 촬영" title="카메라로 촬영">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        </button>
                    </div>
                </div>
                <p id="pr-photo-hint" class="pr-hint pr-photo-hint">
                    <span class="pr-photo-hint-line">상품과 관련된 사진 5장까지 등록할 수 있습니다.</span>
                    <span class="pr-photo-hint-line">홈페이지에서 상품 상세보기하면 스크롤해서 볼 수 있습니다.</span>
                </p>
                <div id="pr-photo-slots" class="pr-photo-gallery" aria-live="polite"></div>
                <p id="pr-photo-count" class="pr-photo-count">사진 없음</p>
            </div>
            <div class="pr-divider" role="separator" aria-hidden="true"></div>

            <div class="pr-section-block pr-explain-field">
                <label for="pr-pd-explain">상품 설명</label>
                <div class="pr-explain-box">
                    <textarea id="pr-pd-explain" name="pd_explain" rows="4" required maxlength="256" placeholder="한글 기준 256자 이내"></textarea>
                </div>
            </div>
            <div class="pr-divider" role="separator" aria-hidden="true"></div>

            <div class="pr-section-block pr-section-block--last">
                <div class="pr-row pr-row--contact">
                    <div class="pr-contact-slot">
                        <label for="pr-per-name">담당자 이름</label>
                        <input type="text" id="pr-per-name" name="per_name" maxlength="80" autocomplete="name" placeholder="담당자 이름">
                    </div>
                    <div class="pr-contact-slot">
                        <label for="pr-per-number">담당자 전화</label>
                        <input type="tel" id="pr-per-number" name="per-number" maxlength="40" autocomplete="tel" placeholder="010-0000-0000">
                    </div>
                    <div class="pr-contact-slot">
                        <label for="pr-per-email">담당자 이메일</label>
                        <input type="email" id="pr-per-email" name="per-email" maxlength="120" autocomplete="email" placeholder="email@example.com">
                    </div>
                </div>
            </div>

            <div class="pr-actions">
                <button type="submit" class="btn btn-primary" id="pr-submit">저장</button>
            </div>
        </form>

        <div id="pr-save-modal" class="pr-save-modal" hidden role="dialog" aria-modal="true" aria-labelledby="pr-save-modal-title">
            <div class="pr-save-modal__panel">
                <h2 id="pr-save-modal-title" class="pr-save-modal__title">저장 완료</h2>
                <p class="pr-save-modal__lead">저장이 완료되었습니다.</p>
                <p class="pr-save-modal__hint">계속하시겠습니까?</p>
                <div class="pr-save-modal__actions">
                    <button type="button" class="btn btn-primary" id="pr-save-continue">계속입력</button>
                    <button type="button" class="btn btn-secondary" id="pr-save-exit">나가기</button>
                </div>
            </div>
        </div>

        <div id="pr-dept-modal" class="vr-dept-modal" hidden role="dialog" aria-modal="true" aria-labelledby="pr-dept-modal-title">
            <div class="vr-dept-modal__panel">
                <h2 id="pr-dept-modal-title" class="vr-dept-modal__title">사업부문 선택</h2>
                <p class="vr-dept-modal__hint">6개 부문 중 한 개 이상 선택할 수 있습니다.</p>
                <div id="pr-dept-modal-options" class="vr-dept-modal__options"></div>
                <div class="vr-dept-modal__actions">
                    <button type="button" class="btn btn-primary" id="pr-dept-modal-ok">적용</button>
                    <button type="button" class="vr-dept-modal__close" id="pr-dept-modal-close">취소</button>
                </div>
            </div>
        </div>
    </main>
        <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
</div>
    </footer>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                var y = now.getFullYear();
                var m = String(now.getMonth() + 1).padStart(2, "0");
                var d = String(now.getDate()).padStart(2, "0");
                todayEl.dateTime = y + "-" + m + "-" + d;
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            function syncAuthUi() {
                var loggedIn = window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn();
                if (logoutBtn) logoutBtn.hidden = !loggedIn;
            }
            syncAuthUi();
        })();
    </script>
    <script src="product-info-modal.js"></script>
    <script src="product-register.js"></script>
</body>
</html>
