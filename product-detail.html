<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 상세 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .page-main--product-detail {
            max-width: 56rem;
            padding: 0.75rem 0.85rem 1.25rem;
        }
        .pd-missing { margin: 0; color: #3d5166; line-height: 1.55; }
        .pd-missing a { color: var(--dz-blue); font-weight: 600; }
        .pd-article {
            max-width: 48rem;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 14px rgba(10, 77, 156, 0.08);
        }
        .pd-toolbar {
            padding: 0.55rem 0.9rem;
            background: #fff;
            border-bottom: 1px solid #e8edf2;
        }
        .pd-back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            color: var(--dz-blue);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            line-height: 1.35;
        }
        .pd-back-link:hover { text-decoration: underline; }
        .pd-main {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 0.65rem 0.85rem 0.7rem 0.3rem;
        }
        .pd-hero-wrap {
            flex: 0 0 auto;
            width: 42%;
            max-width: 20rem;
            min-width: 0;
            background: #f4f6f9;
            border-radius: 8px;
            overflow: hidden;
        }
        .pd-hero-img {
            width: 100%;
            max-height: min(48vh, 33rem);
            object-fit: contain;
            object-position: left top;
            display: block;
            margin: 0;
            background: #f4f6f9;
        }
        .pd-hero-img--empty {
            width: 100%;
            min-height: 13.5rem;
            max-height: min(48vh, 33rem);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0.5rem 0.65rem;
            font-size: 0.95rem;
            color: #8a9bab;
            box-sizing: border-box;
        }
        .pd-summary {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding-top: 0.1rem;
        }
        .pd-title {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
            color: #052a4d;
            line-height: 1.32;
        }
        .pd-prices .pd-price {
            margin: 0;
        }
        .pd-price {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--dz-blue);
            line-height: 1.4;
        }
        .pd-price-label {
            display: inline-block;
            min-width: 3.2rem;
            font-size: 0.88rem;
            font-weight: 600;
            color: #3d556d;
        }
        .pd-spec {
            margin: 0;
            font-size: 0.92rem;
            color: #3d556d;
            line-height: 1.45;
        }
        .pd-content {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.55;
            color: #3d5166;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .pd-below {
            padding: 0 1rem 1.2rem;
            border-top: 1px solid #e8edf2;
        }
        .pd-contact {
            margin: 0.85rem 0 0;
            padding-top: 0.75rem;
            border-top: 1px solid #e8edf2;
            display: grid;
            grid-template-columns: 5.5rem minmax(0, 1fr);
            gap: 0.35rem 0.75rem;
            font-size: 0.92rem;
        }
        .pd-contact dt { margin: 0; font-weight: 700; color: #2a4a5e; }
        .pd-contact dd { margin: 0; color: #3d5166; }
        .pd-contact a { color: var(--dz-blue); text-decoration: none; }
        .pd-contact a:hover { text-decoration: underline; }
        .pd-price-masked {
            font-size: 1rem;
            font-weight: 600;
            color: #6b7c8e;
        }
        .pd-order {
            margin: 1rem 0 1.25rem;
            padding: 1rem 1rem 1.1rem;
            background: #f4f8fc;
            border: 1px solid #d4e2f0;
            border-radius: 10px;
        }
        .pd-order-hint { margin: 0 0 0.75rem; font-size: 0.9rem; color: #3d556d; }
        .pd-order-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 0.65rem;
            align-items: center;
        }
        .pd-order-row label { font-weight: 600; color: #2a4a5e; }
        .pd-order-price { margin: 0.65rem 0 0; font-weight: 700; color: var(--dz-blue); }
        .pd-order-msg { margin: 0.5rem 0 0; font-size: 0.9rem; }
        .pd-order-msg--ok { color: #1b5e20; }
        .pd-order-msg--err { color: #b71c1c; }
        .pd-order-browse-only {
            margin: 1rem 0;
            padding: 0.85rem 1rem;
            background: #f8f4e8;
            border: 1px solid #e6d9b8;
            border-radius: 8px;
            font-size: 0.92rem;
            color: #5a4a2e;
            line-height: 1.5;
        }
        @media (max-width: 720px) {
            .page-main--product-detail {
                padding: 0.45rem 0.55rem 0.85rem;
            }
            .pd-article {
                border-radius: 10px;
                box-shadow: 0 1px 8px rgba(10, 77, 156, 0.06);
            }
            .pd-toolbar {
                padding: 0.45rem 0.55rem;
            }
            .pd-back-link {
                font-size: 0.84rem;
            }
            .pd-main {
                gap: 0.55rem;
                padding: 0.5rem 0.55rem 0.55rem 0.2rem;
            }
            .pd-hero-wrap {
                width: 57%;
                max-width: none;
            }
            .pd-hero-img {
                max-height: min(54vh, 20.8rem);
            }
            .pd-hero-img--empty {
                min-height: 10.4rem;
                max-height: min(54vh, 20.8rem);
                font-size: 0.86rem;
            }
            .pd-summary {
                gap: 0.32rem;
            }
            .pd-title {
                font-size: 1.05rem;
                line-height: 1.28;
            }
            .pd-price {
                font-size: 0.92rem;
            }
            .pd-price-label {
                min-width: 2.6rem;
                font-size: 0.82rem;
            }
            .pd-spec {
                font-size: 0.84rem;
                line-height: 1.4;
            }
            .pd-content {
                font-size: 0.86rem;
                line-height: 1.48;
            }
            .pd-below {
                padding: 0 0.65rem 0.85rem;
            }
            .pd-order {
                margin: 0.65rem 0 0.75rem;
                padding: 0.7rem 0.75rem 0.8rem;
            }
            .pd-order-hint {
                margin: 0 0 0.5rem;
                font-size: 0.82rem;
                line-height: 1.4;
            }
            .pd-order-price {
                margin: 0.45rem 0 0;
                font-size: 0.9rem;
            }
            .pd-contact {
                margin: 0.6rem 0 0;
                padding-top: 0.55rem;
                gap: 0.2rem 0.45rem;
                font-size: 0.82rem;
            }
            .pd-order-browse-only {
                margin: 0.65rem 0;
                padding: 0.65rem 0.75rem;
                font-size: 0.84rem;
                line-height: 1.42;
            }
        }
    </style>
    <script src="api-config.js"></script>

</head>

    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                var y = now.getFullYear();
                var m = String(now.getMonth() + 1).padStart(2, "0");
                var d = String(now.getDate()).padStart(2, "0");
                todayEl.dateTime = y + "-" + m + "-" + d;
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            function syncAuthUi() {
                var loggedIn = window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn();
                if (logoutBtn) logoutBtn.hidden = !loggedIn;
            }
            if (logoutBtn) {
                logoutBtn.addEventListener("click", function () {
                    if (window.THEJHON_AUTH) THEJHON_AUTH.clearSession();
                    location.reload();
                });
            }
            syncAuthUi();
        })();
    </script>
