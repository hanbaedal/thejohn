<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>상품 상세 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .page-main--product-detail {
            max-width: 56rem;
            padding: 0.75rem 0.85rem 1.25rem;
        }
        .pd-missing { margin: 0; color: #3d5166; line-height: 1.55; }
        .pd-missing a { color: var(--dz-blue); font-weight: 600; }
        .pd-feed {
            max-width: 40rem;
            margin: 0 auto;
        }
        .pd-feed-toolbar {
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 0.35rem 0.5rem 0.5rem;
            margin-bottom: 0.5rem;
            background: rgba(245, 247, 250, 0.96);
            backdrop-filter: blur(6px);
        }
        .pd-feed-list {
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
            padding-bottom: 1.5rem;
        }
        .pd-article {
            max-width: 48rem;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 14px rgba(10, 77, 156, 0.08);
            scroll-margin-top: 4.5rem;
        }
        .pd-article.is-current {
            border-color: var(--dz-blue);
            box-shadow: 0 4px 18px rgba(10, 77, 156, 0.14);
        }
        .pd-toolbar {
            padding: 0.55rem 0.9rem;
            background: #fff;
            border-bottom: 1px solid #e8edf2;
        }
        .pd-back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.38rem 0.85rem 0.38rem 0.5rem;
            border-radius: 999px;
            border: 1px solid #d4e0ed;
            background: #fff;
            color: #1a4a6e;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            line-height: 1;
            box-shadow: 0 1px 4px rgba(10, 77, 156, 0.07);
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .pd-back-link:hover {
            background: #eef4fc;
            border-color: var(--dz-blue);
            color: var(--dz-blue);
            text-decoration: none;
        }
        .pd-back-link__icon {
            display: flex;
            flex-shrink: 0;
            line-height: 0;
            opacity: 0.85;
        }
        .pd-back-link__text {
            letter-spacing: -0.02em;
        }
        .pd-main {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0.75rem;
            padding: 0.75rem 0.85rem 0.85rem;
        }
        .pd-hero-wrap {
            flex: 0 0 auto;
            width: 100%;
            max-width: none;
            min-width: 0;
            background: #f4f6f9;
            border-radius: 8px;
            overflow: hidden;
        }
        .pd-hero-img {
            width: 100%;
            max-height: min(52vh, 28rem);
            object-fit: contain;
            object-position: center top;
            display: block;
            margin: 0 auto;
            background: #f4f6f9;
        }
        .pd-hero-img--empty {
            width: 100%;
            min-height: 12rem;
            max-height: min(52vh, 28rem);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 0.65rem;
            font-size: 0.95rem;
            color: #8a9bab;
            box-sizing: border-box;
            text-align: center;
        }
        .pd-summary {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding-top: 0.1rem;
        }
        .pd-title {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
            color: #052a4d;
            line-height: 1.32;
        }
        .pd-prices .pd-price {
            margin: 0;
        }
        .pd-price {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--dz-blue);
            line-height: 1.4;
        }
        .pd-price-label {
            display: inline-block;
            min-width: 3.2rem;
            font-size: 0.88rem;
            font-weight: 600;
            color: #3d556d;
        }
        .pd-spec {
            margin: 0;
            font-size: 0.92rem;
            color: #3d556d;
            line-height: 1.45;
        }
        .pd-contact {
            margin: 0.35rem 0 0;
            padding: 0.55rem 0.65rem;
            background: #f4f8fc;
            border: 1px solid #e0e8f2;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 4.25rem minmax(0, 1fr);
            gap: 0.3rem 0.55rem;
            font-size: 0.92rem;
        }
        .pd-contact dt { margin: 0; font-weight: 700; color: #2a4a5e; }
        .pd-contact dd { margin: 0; color: #3d5166; }
        .pd-contact a { color: var(--dz-blue); text-decoration: none; font-weight: 600; }
        .pd-contact a:hover { text-decoration: underline; }
        .pd-contact-empty { color: #8a9bab; }
        .pd-content {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.55;
            color: #3d5166;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .pd-below {
            padding: 0 1rem 1.2rem;
            border-top: 1px solid #e8edf2;
        }
        .pd-price-masked {
            font-size: 1rem;
            font-weight: 600;
            color: #6b7c8e;
        }
        .pd-order {
            margin: 1rem 0 1.25rem;
            padding: 1rem 1rem 1.1rem;
            background: #f4f8fc;
            border: 1px solid #d4e2f0;
            border-radius: 10px;
        }
        .pd-order-hint { margin: 0 0 0.75rem; font-size: 0.9rem; color: #3d556d; }
        .pd-order-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 0.65rem;
            align-items: center;
        }
        .pd-order-row label { font-weight: 600; color: #2a4a5e; }
        .pd-order-price { margin: 0.65rem 0 0; font-weight: 700; color: var(--dz-blue); }
        .pd-order-msg { margin: 0.5rem 0 0; font-size: 0.9rem; }
        .pd-order-msg--ok { color: #1b5e20; }
        .pd-order-msg--err { color: #b71c1c; }
        .pd-order-browse-only {
            margin: 1rem 0;
            padding: 0.85rem 1rem;
            background: #f8f4e8;
            border: 1px solid #e6d9b8;
            border-radius: 8px;
            font-size: 0.92rem;
            color: #5a4a2e;
            line-height: 1.5;
        }
        .pd-summary .ps-order {
            margin: 0.5rem 0 0;
            padding: 0;
        }
        .pd-summary .ps-order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .pd-summary .ps-order-actions .btn {
            flex: 1 1 calc(50% - 0.25rem);
            min-width: 0;
            font-size: 0.88rem;
            padding: 0.5rem 0.65rem;
        }
        @media (max-width: 720px) {
            .page-main--product-detail {
                padding: 0.45rem 0.55rem 0.85rem;
            }
            .pd-article {
                border-radius: 10px;
                box-shadow: 0 1px 8px rgba(10, 77, 156, 0.06);
            }
            .pd-toolbar {
                padding: 0.45rem 0.55rem;
            }
            .pd-back-link {
                font-size: 0.82rem;
                padding: 0.34rem 0.7rem 0.34rem 0.45rem;
            }
            .pd-feed-toolbar {
                padding: 0.3rem 0.4rem 0.45rem;
            }
            .pd-main {
                gap: 0.55rem;
                padding: 0.55rem 0.6rem 0.65rem;
            }
            .pd-hero-img {
                max-height: min(48vh, 22rem);
            }
            .pd-hero-img--empty {
                min-height: 10rem;
                max-height: min(48vh, 22rem);
                font-size: 0.86rem;
            }
            .pd-summary {
                gap: 0.32rem;
            }
            .pd-title {
                font-size: 1.05rem;
                line-height: 1.28;
            }
            .pd-price {
                font-size: 0.92rem;
            }
            .pd-price-label {
                min-width: 2.6rem;
                font-size: 0.82rem;
            }
            .pd-spec {
                font-size: 0.84rem;
                line-height: 1.4;
            }
            .pd-contact {
                font-size: 0.84rem;
                padding: 0.45rem 0.55rem;
                grid-template-columns: 3.6rem minmax(0, 1fr);
            }
            .pd-content {
                font-size: 0.86rem;
                line-height: 1.48;
            }
            .pd-below {
                padding: 0 0.65rem 0.85rem;
            }
            .pd-order {
                margin: 0.65rem 0 0.75rem;
                padding: 0.7rem 0.75rem 0.8rem;
            }
            .pd-order-hint {
                margin: 0 0 0.5rem;
                font-size: 0.82rem;
                line-height: 1.4;
            }
            .pd-order-price {
                margin: 0.45rem 0 0;
                font-size: 0.9rem;
            }
            .pd-contact {
                margin: 0.6rem 0 0;
                padding-top: 0.55rem;
                gap: 0.2rem 0.45rem;
                font-size: 0.82rem;
            }
            .pd-order-browse-only {
                margin: 0.65rem 0;
                padding: 0.65rem 0.75rem;
                font-size: 0.84rem;
                line-height: 1.42;
            }
        }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="vendor-cart.js"></script>
    <script src="catalog-order-ui.js"></script>
    <script src="order-ui.js"></script>
    <link rel="stylesheet" href="vendor-order-modal.css">
    <script src="vendor-order-modal.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
    <script src="product-detail.js" defer></script>
</head>
<body class="page-product-detail">
    <header class="site-header">
        <div class="site-header-start">
            <a href="index.html" class="dz-logo dz-logo--compact" aria-label="더존 홈"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <div class="nav-dropdown" data-nav-dropdown="support">
                    <a href="support.html" class="header-nav-link nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="supportSubmenu">고객센터</a>
                    <div id="supportSubmenu" class="nav-dropdown-panel" role="menu" aria-label="고객센터 하위 메뉴">
                        <a href="support-partners.html" class="nav-dropdown-item" role="menuitem">파트너회사 소개</a>
                        <a href="support-library.html" class="nav-dropdown-item" role="menuitem">최근소식</a>
                        <a href="support-qna.html" class="nav-dropdown-item" role="menuitem">자유게시판</a>
                        <a href="support-inquiry.html" class="nav-dropdown-item" role="menuitem">문의사항</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--product-detail">
        <div id="pd-root" aria-live="polite"></div>
    </main>
        <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
</div>
    </footer>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                var y = now.getFullYear();
                var m = String(now.getMonth() + 1).padStart(2, "0");
                var d = String(now.getDate()).padStart(2, "0");
                todayEl.dateTime = y + "-" + m + "-" + d;
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            function syncAuthUi() {
                var loggedIn = window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn();
                if (logoutBtn) logoutBtn.hidden = !loggedIn;
            }
            if (logoutBtn) {
                logoutBtn.addEventListener("click", function () {
                    if (window.THEJHON_AUTH) THEJHON_AUTH.clearSession();
                    location.reload();
                });
            }
            syncAuthUi();
        })();
    </script>
</body>
</html>
