<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사업부문 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .ps-page { max-width: 1100px; margin: 0 auto; }
        .ps-empty { margin: 0; color: #3d5166; line-height: 1.55; }
        .ps-empty a { color: var(--dz-blue); font-weight: 600; }
        .ps-icons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.65rem;
            margin: 0 0 1.25rem;
            padding: 0;
            list-style: none;
        }
        @media (min-width: 640px) {
            .ps-icons { grid-template-columns: repeat(6, 1fr); gap: 0.75rem; }
        }
        .ps-icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            width: 100%;
            padding: 0.65rem 0.35rem;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            font-family: inherit;
            color: #3d5166;
            -webkit-tap-highlight-color: transparent;
            transition: border-color 0.15s, background 0.15s;
        }
        .ps-icon-btn:hover { border-color: #b8c8dc; background: #f8fafc; }
        .ps-icon-btn.is-active {
            border-color: var(--dz-blue);
            background: #eef4fc;
            color: var(--dz-blue);
        }
        .ps-icon-btn.is-active .ps-icon-label { font-weight: 700; }
        .ps-icon {
            font-size: 1.75rem;
            line-height: 1;
        }
        .ps-icon-label {
            font-size: clamp(0.72rem, 2.5vw, 0.88rem);
            font-weight: 600;
            line-height: 1.2;
        }
        .ps-grid {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 0.65rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        @media (min-width: 900px) {
            .ps-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; }
        }
        @media (min-width: 1200px) {
            .ps-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }
        .ps-card-wrap { margin: 0; min-width: 0; }
        .ps-card-link {
            display: flex;
            flex-direction: column;
            aspect-ratio: 1;
            width: 100%;
            text-decoration: none;
            color: inherit;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(10, 77, 156, 0.06);
        }
        .ps-card-link:hover {
            border-color: #b8c8dc;
            box-shadow: 0 4px 12px rgba(10, 77, 156, 0.1);
        }
        .ps-card-visual {
            flex: 1 1 0;
            min-height: 0;
            position: relative;
            background: #f0f3f7;
            overflow: hidden;
        }
        .ps-card-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            vertical-align: top;
        }
        .ps-card-photo--loading { background: #e8edf2; }
        .ps-card-photo--empty {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            color: #8a9bab;
            text-align: center;
            line-height: 1.3;
        }
        .ps-card-body {
            flex: 0 0 auto;
            padding: 0.45rem 0.4rem 0.5rem;
            text-align: center;
            border-top: 1px solid #eef2f6;
            background: #fff;
        }
        .ps-card-title {
            margin: 0;
            font-size: clamp(0.78rem, 3.2vw, 0.92rem);
            font-weight: 700;
            color: #052a4d;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .ps-card-spec {
            margin: 0.2rem 0 0;
            font-size: clamp(0.7rem, 2.8vw, 0.8rem);
            font-weight: 600;
            color: #5a6d7e;
            line-height: 1.25;
        }
        .ps-card-spec--none { color: #a8b5c2; font-weight: 500; }
        .ps-card-price {
            margin: 0.25rem 0 0;
            font-size: clamp(0.72rem, 2.9vw, 0.84rem);
            font-weight: 700;
            color: var(--dz-blue);
            line-height: 1.3;
        }
        .ps-card-price-label {
            font-size: 0.68em;
            font-weight: 600;
            color: #3d556d;
        }
        .ps-card-wrap--order .ps-card {
            display: flex;
            flex-direction: column;
            aspect-ratio: auto;
            height: 100%;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(10, 77, 156, 0.06);
        }
        .ps-card-detail-link {
            display: flex;
            flex-direction: column;
            flex: 0 0 auto;
            text-decoration: none;
            color: inherit;
        }
        .ps-card-detail-link:hover .ps-card-title { color: var(--dz-blue); }
        .ps-card-wrap--order .ps-card-visual {
            flex: 0 0 auto;
            height: 7.5rem;
            aspect-ratio: auto;
        }
        .ps-card-body--meta {
            flex: 1 1 auto;
            padding: 0.35rem 0.45rem 0.5rem;
            text-align: center;
            border-top: 1px solid #eef2f6;
        }
        .ps-order {
            margin: 0.35rem 0 0;
            padding: 0.4rem;
        }
        .ps-order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .ps-order-actions .btn {
            flex: 1 1 calc(50% - 0.2rem);
            min-width: 0;
            font-size: 0.68rem;
            padding: 0.35rem 0.4rem;
        }
        @media (min-width: 640px) {
            .ps-card-wrap--order .ps-card-visual { height: 8.5rem; }
            .ps-order-actions .btn { font-size: 0.72rem; }
        }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="vendor-cart.js"></script>
    <script src="catalog-order-ui.js"></script>
    <script src="qty-stepper.js"></script>
    <link rel="stylesheet" href="vendor-order-modal.css">
    <script src="vendor-order-modal.js"></script>
    <script src="admin-header.js"></script>
    <script src="product-catalog.js"></script>
    <script src="nav.js" defer></script>
    <script src="products.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link is-current">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <div class="nav-dropdown" data-nav-dropdown="support">
                    <a href="support.html" class="header-nav-link nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="supportSubmenu">고객센터</a>
                    <div id="supportSubmenu" class="nav-dropdown-panel" role="menu" aria-label="고객센터 하위 메뉴">
                        <a href="support-partners.html" class="nav-dropdown-item" role="menuitem">파트너회사 소개</a>
                        <a href="support-library.html" class="nav-dropdown-item" role="menuitem">최근소식</a>
                        <a href="support-qna.html" class="nav-dropdown-item" role="menuitem">자유게시판</a>
                        <a href="support-inquiry.html" class="nav-dropdown-item" role="menuitem">문의사항</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar ps-page" id="ps-page-main">
        <ul class="ps-icons" id="ps-dept-nav" role="tablist" aria-label="사업부문">
            <li role="presentation">
                <button type="button" class="ps-icon-btn is-active" role="tab" aria-selected="true" data-dept="jeongyuk">
                    <span class="ps-icon" aria-hidden="true">🥩</span>
                    <span class="ps-icon-label">정육</span>
                </button>
            </li>
            <li role="presentation">
                <button type="button" class="ps-icon-btn" role="tab" aria-selected="false" data-dept="driedfish">
                    <span class="ps-icon" aria-hidden="true">🐟</span>
                    <span class="ps-icon-label">건어물</span>
                </button>
            </li>
            <li role="presentation">
                <button type="button" class="ps-icon-btn" role="tab" aria-selected="false" data-dept="frozen">
                    <span class="ps-icon" aria-hidden="true">🧊</span>
                    <span class="ps-icon-label">냉동식품</span>
                </button>
            </li>
            <li role="presentation">
                <button type="button" class="ps-icon-btn" role="tab" aria-selected="false" data-dept="seafood">
                    <span class="ps-icon" aria-hidden="true">🦐</span>
                    <span class="ps-icon-label">냉동수산물</span>
                </button>
            </li>
            <li role="presentation">
                <button type="button" class="ps-icon-btn" role="tab" aria-selected="false" data-dept="grocery">
                    <span class="ps-icon" aria-hidden="true">🛒</span>
                    <span class="ps-icon-label">공산품</span>
                </button>
            </li>
            <li role="presentation">
                <button type="button" class="ps-icon-btn" role="tab" aria-selected="false" data-dept="drink">
                    <span class="ps-icon" aria-hidden="true">🥤</span>
                    <span class="ps-icon-label">음료수</span>
                </button>
            </li>
        </ul>
        <div id="ps-root" aria-live="polite">
            <p class="ps-empty">상품을 불러오는 중…</p>
        </div>
    </main>
        <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
</div>
    </footer>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                var y = now.getFullYear();
                var m = String(now.getMonth() + 1).padStart(2, "0");
                var d = String(now.getDate()).padStart(2, "0");
                todayEl.dateTime = y + "-" + m + "-" + d;
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            function syncAuthUi() {
                var loggedIn = window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn();
                if (logoutBtn) logoutBtn.hidden = !loggedIn;
            }
            if (logoutBtn) {
                logoutBtn.addEventListener("click", function () {
                    if (window.THEJHON_AUTH) THEJHON_AUTH.clearSession();
                    location.reload();
                });
            }
            syncAuthUi();
        })();
    </script>
</body>
</html>
