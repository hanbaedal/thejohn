<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <title>발주서 관리 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="admin-manage.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="order-detail-modal.css">
    <link rel="stylesheet" href="order-list-filters.css">
    <style>
        .ol-admin-list { list-style: none; margin: 0; padding: 0; }
        .ol-list-scroll { max-height: 19rem; overflow-y: auto; }
        .ol-admin-item {
            display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
            padding: 0.85rem 1rem; border: 1px solid #e0e6ed; border-radius: 8px;
            margin-bottom: 0.5rem; background: #fff; cursor: pointer;
        }
        .ol-admin-item.is-selected { border-color: var(--dz-blue, #0a4d9c); box-shadow: 0 0 0 2px rgba(10, 77, 156, 0.15); }
        .ol-admin-main { flex: 1; min-width: 12rem; }
        .ol-admin-name { display: block; font-weight: 700; color: #052a4d; }
        .ol-admin-meta { font-size: 0.85rem; color: #5a6d7e; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="order-ui.js"></script>
    <script src="order-detail-modal.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="staff-manage-hub.html" class="header-nav-link is-current">관리자관리</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <div class="nav-dropdown" data-nav-dropdown="support">
                    <a href="support.html" class="header-nav-link nav-dropdown-trigger">고객센터</a>
                    <div class="nav-dropdown-panel" role="menu">
                        <a href="support-partners.html" class="nav-dropdown-item" role="menuitem">파트너회사 소개</a>
                        <a href="support-library.html" class="nav-dropdown-item" role="menuitem">최근소식</a>
                        <a href="support-qna.html" class="nav-dropdown-item" role="menuitem">자유게시판</a>
                        <a href="support-inquiry.html" class="nav-dropdown-item" role="menuitem">문의사항</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar shub-page">
        <p class="shub-subnav"><a href="order-manage-hub.html">← 발주서 관리</a></p>
        <h1>발주서 관리</h1>
        <p id="sol-status" class="shub-status" role="status"></p>
        <div class="ol-query-filters" aria-label="발주서 조회 조건">
            <section class="ol-query-filters__section" aria-labelledby="sol-filter-period-heading">
                <h2 id="sol-filter-period-heading" class="ol-query-filters__heading">기간으로조회</h2>
                <div class="ol-query-filters__row">
                    <label for="sol-date-from">시작일</label>
                    <input type="date" id="sol-date-from">
                </div>
                <div class="ol-query-filters__row">
                    <label for="sol-date-to">종료일</label>
                    <input type="date" id="sol-date-to">
                </div>
            </section>
            <section class="ol-query-filters__section" aria-labelledby="sol-filter-admin-heading">
                <h2 id="sol-filter-admin-heading" class="ol-query-filters__heading">담당관리자조회</h2>
                <div class="ol-query-filters__row ol-query-filters__row--query">
                    <label for="sol-admin">담당 관리자</label>
                    <select id="sol-admin">
                        <option value="">전체</option>
                    </select>
                    <button type="button" class="btn btn-primary" id="sol-search">조회</button>
                </div>
            </section>
        </div>
        <section class="shub-panel">
            <div id="sol-summary" class="shub-summary" hidden></div>
            <div id="sol-by-admin" class="shub-table-wrap shub-list-scroll" hidden></div>
            <div id="sol-list" class="ol-list-scroll"></div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <div
        id="sol-detail-modal"
        class="odm-modal"
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="odm-detail-title"
    >
        <div id="sol-detail-panel" class="odm-panel" aria-live="polite"></div>
    </div>
    <script src="supervisor-order-list.js"></script>
</body>
</html>
