<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>업체관리 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <style>
        .vm-rows {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .vm-group + .vm-group {
            margin-top: 2.7rem;
        }
        .vm-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.95rem;
        }
        @media (max-width: 720px) {
            .vm-row {
                grid-template-columns: 1fr;
            }
        }
        .vm-row--single {
            grid-template-columns: 1fr;
            margin-top: 0.95rem;
        }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="staff-vendor-boot.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--vendor" aria-label="업체관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="company-main company-main--support-hub">
        <p class="shub-subnav"><a href="work-hub.html">← 그룹 마케팅 관리</a></p>
        <div class="company-divisions vm-rows">
            <div class="vm-group">
                <div class="vm-row">
                    <a href="vendor-register.html" class="company-division-card">
                        <h2>업체 등록</h2>
                    </a>
                    <a href="vendor-list-admin.html" class="company-division-card">
                        <h2>업체 리스트</h2>
                    </a>
                </div>
                <div class="vm-row vm-row--single">
                    <a href="vendor-dm-print.html" class="company-division-card">
                        <h2>업체별 DM 출력</h2>
                    </a>
                </div>
            </div>
            <div class="vm-group">
                <div class="vm-row">
                    <a href="vendor-email-broadcast.html" class="company-division-card">
                        <h2>이메일 보내기</h2>
                    </a>
                    <a href="vendor-email-history.html" class="company-division-card">
                        <h2>이메일 발송 내역</h2>
                    </a>
                </div>
            </div>
            <div class="vm-group">
                <div class="vm-row">
                    <a href="vendor-new-register.html" class="company-division-card">
                        <h2>신규업체 등록</h2>
                    </a>
                    <a href="vendor-new-list.html" class="company-division-card">
                        <h2>신규업체 리스트</h2>
                    </a>
                </div>
            </div>
            <div class="vm-group">
                <div class="vm-row">
                    <a href="vendor-prospect-finder.html" class="company-division-card" id="vm-prospect-finder" hidden>
                        <h2>예비 업체 찾기</h2>
                    </a>
                    <a href="vendor-prospect-list.html" class="company-division-card">
                        <h2>예비업체 리스트</h2>
                    </a>
                </div>
            </div>
        </div>
    </main>
        <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
</div>
    </footer>
    <script>
        (function () {
            var Auth = window.THEJHON_AUTH;
            if (Auth && Auth.setStaffNavMode) Auth.setStaffNavMode("vendor-manage");
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                var y = now.getFullYear();
                var m = String(now.getMonth() + 1).padStart(2, "0");
                var d = String(now.getDate()).padStart(2, "0");
                todayEl.dateTime = y + "-" + m + "-" + d;
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            function syncAuthUi() {
                var loggedIn = window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn();
                if (logoutBtn) logoutBtn.hidden = !loggedIn;
            }
            syncAuthUi();
            function syncSupportHubAdminCards() {
                var hubNews = document.getElementById("support-hub-news-admin");
                var migrateCard = document.getElementById("vm-data-migrate");
                var finderCard = document.getElementById("vm-prospect-finder");
                var admin =
                    window.THEJHON_AUTH &&
                    THEJHON_AUTH.canManageRegisters &&
                    THEJHON_AUTH.canManageRegisters();
                if (hubNews) {
                    hubNews.hidden = !admin;
                    hubNews.setAttribute("aria-hidden", admin ? "false" : "true");
                }
                if (migrateCard) {
                    migrateCard.hidden = !admin;
                    migrateCard.setAttribute("aria-hidden", admin ? "false" : "true");
                }
                if (finderCard) {
                    finderCard.hidden = !admin;
                    finderCard.setAttribute("aria-hidden", admin ? "false" : "true");
                }
            }
            syncSupportHubAdminCards();
            if (Auth && Auth.applyStaffNavMode) Auth.applyStaffNavMode("vendor-manage");
        })();
    </script>
</body>
</html>
