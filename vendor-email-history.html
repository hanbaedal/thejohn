<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="public-site-config.js?v=20260620"></script>
    <script src="auth-storage.js?v=20260620-public"></script>
    <script src="site-brand-boot.js"></script>
    <meta name="theme-color" content="#0a4d9c">
    <title>이메일 발송 내역 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="admin-manage.css">
    <link rel="stylesheet" href="order-list-filters.css">
    <style>
        .veh-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 28rem;
            overflow-y: auto;
        }
        .veh-list li {
            border: 1px solid #e7edf4;
            border-radius: 8px;
            padding: 0.65rem 0.8rem;
            margin-bottom: 0.5rem;
            background: #fff;
            font-size: 0.88rem;
            color: #3b4f62;
            line-height: 1.5;
        }
        .veh-list strong { color: #052a4d; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="staff-vendor-boot.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--vendor" aria-label="업체관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar">
        <p class="am-subnav"><a href="vendor-manage.html">← 업체관리</a></p>
        <h1>이메일 발송 내역</h1>
        <p id="veh-status" class="vl-status" role="status" aria-live="polite"></p>
        <div class="ol-query-filters" aria-label="이메일 발송 이력 조회 조건">
            <section class="ol-query-filters__section" aria-labelledby="veh-filter-period-heading">
                <h2 id="veh-filter-period-heading" class="ol-query-filters__heading">기간으로조회</h2>
                <div class="ol-query-filters__row">
                    <label for="veh-date-from">시작일</label>
                    <input type="date" id="veh-date-from">
                </div>
                <div class="ol-query-filters__row">
                    <label for="veh-date-to">종료일</label>
                    <input type="date" id="veh-date-to">
                </div>
                <div class="ol-query-filters__row ol-query-filters__row--actions">
                    <button type="button" class="btn btn-primary" id="veh-refresh-btn">조회</button>
                </div>
            </section>
        </div>
        <section class="vei-panel">
            <ul id="veh-list" class="veh-list" aria-live="polite"></ul>
        </section>
    </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script src="vendor-email-history.js"></script>
</body>
</html>
