<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>업체 등록 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="admin-manage.css">
    <link rel="stylesheet" href="address-fields.css">
    <style>
        .vr-form { max-width: min(100%, 56rem); margin: 0 auto 1.5rem; padding: 0.85rem 0.75rem; background: #fff; border: 1px solid #e0e6ed; border-radius: 8px; box-shadow: 0 1px 8px rgba(10, 77, 156, 0.05); }
        .vr-slot > label,
        .vr-field > label { display: block; font-size: 0.7rem; font-weight: 600; color: #5a6b7d; margin-bottom: 0.2rem; line-height: 1.2; }
        .vr-slot input[type="text"],
        .vr-slot input[type="email"],
        .vr-slot input[type="tel"],
        .vr-slot input[type="password"],
        .vr-field input[type="text"],
        .vr-field input[type="email"],
        .vr-field input[type="tel"],
        .vr-field input[type="password"],
        .vr-field textarea { width: 100%; padding: 0.35rem 0.45rem; font-size: 0.8125rem; font-family: inherit; border: 1px solid #c5d0dc; border-radius: 4px; min-height: 2rem; box-sizing: border-box; }
        .vr-field textarea { min-height: 4.5rem; resize: vertical; }
        .vr-slot input:focus,
        .vr-field input:focus,
        .vr-field textarea:focus { outline: none; border-color: var(--dz-blue); box-shadow: 0 0 0 1px rgba(10, 77, 156, 0.2); }
        .vr-slot input[type="file"],
        .vr-field input[type="file"] { font-size: 0.68rem; max-width: 100%; padding: 0.15rem 0; }
        .vr-hint { margin: 0.25rem 0 0; font-size: 0.68rem; color: #7a8a9c; line-height: 1.35; }
        .vr-hint--after-login { margin-top: 0.05rem; margin-bottom: 0.55rem; }
        .vr-hint--logo { margin: 0.35rem 0 0.55rem; }
        .vr-preview-sm.pr-photo-preview { width: 6rem; height: 6rem; object-fit: cover; margin-top: 0.45rem; border: 1px solid #e0e6ed; border-radius: 6px; background: #f8fafc; }
        .vr-row { display: grid; gap: 0.35rem 0.45rem; margin-bottom: 0.55rem; align-items: end; }
        .vr-row--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .vr-row--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        @media (max-width: 900px) {
            .vr-row--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 520px) {
            .vr-row--3 { grid-template-columns: 1fr; }
            .vr-row--4 { grid-template-columns: 1fr; }
        }
        .vr-field { margin-bottom: 0.55rem; }
        .vr-preview-sm { display: block; max-width: 100%; max-height: 3.25rem; margin-top: 0.2rem; border-radius: 4px; border: 1px solid #e8edf2; object-fit: contain; background: #f8fafc; }
        .vr-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.65rem; }
        .vr-actions .btn { border: 2px solid var(--dz-blue); background: #fff; color: var(--dz-blue); padding: 0.38rem 0.85rem; font-size: 0.8125rem; font-weight: 600; border-radius: 5px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; }
        .vr-actions .btn-primary { background: var(--dz-blue); color: #fff; }
        .vr-actions .btn-secondary { border-color: #c5d0dc; color: #3d5166; background: #f4f6f9; }
        .vr-status { margin: 0 0 0.65rem; font-size: 0.8rem; color: #3d5166; min-height: 1.15rem; }
        .vr-list { max-width: min(100%, 56rem); margin: 0 auto; }
        .vr-list h2 { font-size: 1.05rem; margin: 0 0 0.6rem; color: #1a2b3c; }
        .vr-card { background: #fff; border: 1px solid #e0e6ed; border-radius: 8px; padding: 0.75rem 0.85rem; margin-bottom: 0.65rem; box-shadow: 0 1px 4px rgba(10, 77, 156, 0.04); }
        .vr-card-head { display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: flex-start; }
        .vr-thumb { width: 4rem; height: 4rem; object-fit: contain; border-radius: 4px; border: 1px solid #e0e6ed; background: #f4f6f9; flex-shrink: 0; }
        .vr-thumb--empty { display: flex; align-items: center; justify-content: center; font-size: 0.58rem; color: #8a9bab; text-align: center; padding: 0.2rem; line-height: 1.15; }
        .vr-card-main { flex: 1; min-width: 10rem; }
        .vr-card-title { margin: 0 0 0.3rem; font-size: 1rem; font-weight: 700; color: #052a4d; }
        .vr-card-meta { margin: 0; font-size: 0.78rem; line-height: 1.45; color: #3d556d; }
        .vr-card-addr { font-weight: 500; color: #3d5166; }
        .vr-card-meta a { color: var(--dz-blue); word-break: break-all; }
        .vr-card-note { margin: 0.45rem 0 0; font-size: 0.82rem; line-height: 1.5; color: #3d5166; white-space: pre-wrap; word-break: break-word; }
        .vr-card-actions { margin-top: 0.55rem; display: flex; gap: 0.35rem; flex-wrap: wrap; }
        .vr-card-actions button { font-size: 0.75rem; padding: 0.28rem 0.55rem; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: 600; border: 1px solid #c5d0dc; background: #fff; color: #3d5166; }
        .vr-card-actions button.vr-btn-del { border-color: #e8a4a4; color: #a12c2c; background: #fff8f8; }
        .vr-grade-wrap { margin-bottom: 0.55rem; }
        .vr-grade-wrap > .vr-grade-caption { display: block; font-size: 0.7rem; font-weight: 600; color: #5a6b7d; margin-bottom: 0.35rem; }
        .vr-grade-btns { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .vr-grade-btn {
            min-width: 2.5rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.8125rem;
            font-weight: 700;
            font-family: inherit;
            border: 2px solid #c5d0dc;
            border-radius: 6px;
            background: #fff;
            color: #3d5166;
            cursor: pointer;
        }
        .vr-grade-btn.is-selected {
            border-color: var(--dz-blue);
            background: var(--dz-blue);
            color: #fff;
        }
        .vr-grade-badge {
            display: inline-block;
            margin-left: 0.35rem;
            padding: 0.1rem 0.45rem;
            font-size: 0.72rem;
            font-weight: 700;
            border-radius: 4px;
            background: #e8f4fc;
            color: var(--dz-blue);
        }
        .vr-pw-wrap { display: flex; gap: 0.25rem; align-items: stretch; }
        .vr-pw-wrap input { flex: 1; min-width: 0; }
        .vr-pw-toggle {
            flex-shrink: 0;
            padding: 0 0.45rem;
            font-size: 0.68rem;
            font-weight: 600;
            font-family: inherit;
            border: 1px solid #c5d0dc;
            border-radius: 4px;
            background: #f4f6f9;
            color: #3d5166;
            cursor: pointer;
        }
        .vr-id-dup-hint, .vr-pw-match-hint {
            margin: 0.2rem 0 0;
            font-size: 0.68rem;
            line-height: 1.35;
        }
        .vr-id-dup-hint[hidden], .vr-pw-match-hint[hidden] { display: none !important; }
        .vr-id-dup-hint--ok, .vr-pw-match-hint--ok { color: #2d6a4f; font-weight: 600; }
        .vr-id-dup-hint--dup, .vr-id-dup-hint--bad, .vr-pw-match-hint--bad { color: #a12c2c; font-weight: 600; }
        .vr-id-dup-hint--checking, .vr-id-dup-hint--err, .vr-pw-match-hint--idle { color: #7a8a9c; }
        .vr-slot input.vr-input--bad, .vr-field input.vr-input--bad { border-color: #c44; }
        .vr-select {
            width: 100%;
            padding: 0.35rem 0.45rem;
            font-size: 0.8125rem;
            font-family: inherit;
            border: 1px solid #c5d0dc;
            border-radius: 4px;
            min-height: 2rem;
            box-sizing: border-box;
            background: #fff;
            color: #1a2b3c;
        }
        .vr-select:focus { outline: none; border-color: var(--dz-blue); box-shadow: 0 0 0 1px rgba(10, 77, 156, 0.2); }
        .vr-dept-row { margin-bottom: 0.65rem; }
        .vr-dept-wrap > .vr-dept-caption {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: #5a6b7d;
            margin-bottom: 0.3rem;
        }
        .vr-dept-checkboxes {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.25rem 0.35rem;
            margin-top: 0.1rem;
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .vr-dept-checkboxes::-webkit-scrollbar {
            height: 4px;
        }
        .vr-dept-check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.22rem;
            flex: 1 1 0;
            min-width: 0;
            font-size: 0.72rem;
            font-weight: 600;
            color: #3d5166;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .vr-dept-check input {
            width: 0.9rem;
            height: 0.9rem;
            margin: 0;
            flex-shrink: 0;
            accent-color: var(--dz-blue);
            cursor: pointer;
        }
        @media (min-width: 640px) {
            .vr-dept-check {
                font-size: 0.8125rem;
                gap: 0.28rem;
            }
            .vr-dept-check input {
                width: 1rem;
                height: 1rem;
            }
        }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="staff-vendor-boot.js"></script>
    <script src="admin-header.js"></script>
    <script src="vendor-form-shared.js"></script>
    <script src="vendor-admin-shared.js"></script>
    <script src="product-form-shared.js"></script>
    <link rel="stylesheet" href="address-fields.css">
    <script src="address-fields.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--vendor" aria-label="업체관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar">
        <p class="am-subnav"><a href="vendor-manage.html">← 업체관리</a></p>
        <h1>업체 등록</h1>
        <p id="vr-registrar-hint" class="vr-hint vr-hint--registrar" hidden></p>
        <p id="vr-status" class="vr-status" role="status" aria-live="polite"></p>
        <form id="vr-form" class="vr-form" novalidate>
            <input type="hidden" id="vr-edit-id" value="">
            <div class="vr-field vr-dept-row vr-dept-wrap">
                <span class="vr-dept-caption" id="vr-dept-label">사업부문</span>
                <div id="vr-dept-checkboxes" class="vr-dept-checkboxes" role="group" aria-labelledby="vr-dept-label">
                    <label class="vr-dept-check"><input type="checkbox" data-dept="jeongyuk" value="jeongyuk"> 정육</label>
                    <label class="vr-dept-check"><input type="checkbox" data-dept="driedfish" value="driedfish"> 건어물</label>
                    <label class="vr-dept-check"><input type="checkbox" data-dept="frozen" value="frozen"> 냉동식품</label>
                    <label class="vr-dept-check"><input type="checkbox" data-dept="seafood" value="seafood"> 냉동수산물</label>
                    <label class="vr-dept-check"><input type="checkbox" data-dept="grocery" value="grocery"> 공산품</label>
                    <label class="vr-dept-check"><input type="checkbox" data-dept="drink" value="drink"> 음료수</label>
                </div>
                <p class="vr-hint">한 개 이상 선택해 주세요.</p>
            </div>
            <div class="vr-row vr-row--3">
                <div class="vr-slot">
                    <label for="vr-login-id">아이디 (업체 로그인용)</label>
                    <input type="text" id="vr-login-id" name="loginId" required maxlength="12" autocomplete="username" placeholder="6~12자 (영문·숫자)" aria-describedby="vr-id-dup-hint">
                    <p id="vr-id-dup-hint" class="vr-id-dup-hint vr-id-dup-hint--idle" hidden></p>
                </div>
                <div class="vr-slot">
                    <label for="vr-login-pw">비밀번호</label>
                    <div class="vr-pw-wrap">
                        <input type="text" id="vr-login-pw" name="password" maxlength="16" autocomplete="new-password" placeholder="8~16자" spellcheck="false">
                        <button type="button" class="vr-pw-toggle" id="vr-pw-toggle" aria-label="비밀번호 숨기기">숨기기</button>
                    </div>
                </div>
                <div class="vr-slot">
                    <label for="vr-login-pw2">비밀번호 확인</label>
                    <div class="vr-pw-wrap">
                        <input type="text" id="vr-login-pw2" name="password_confirm" maxlength="16" autocomplete="new-password" placeholder="비밀번호 다시 입력" aria-describedby="vr-pw-match-hint" spellcheck="false">
                        <button type="button" class="vr-pw-toggle" id="vr-pw2-toggle" aria-label="비밀번호 확인 숨기기">숨기기</button>
                    </div>
                    <p id="vr-pw-match-hint" class="vr-pw-match-hint vr-pw-match-hint--idle" hidden></p>
                </div>
            </div>
            <div class="vr-row vr-row--3">
                <div class="vr-slot">
                    <label for="vr-grade">업체등급</label>
                    <select id="vr-grade" name="vn_grade" class="vr-select" required>
                        <option value="1" selected>Silver</option>
                        <option value="2">Gold</option>
                        <option value="3">Diamond</option>
                    </select>
                </div>
                <div class="vr-slot">
                    <label for="vr-room-count">빈소 수</label>
                    <input type="number" id="vr-room-count" name="vn_room_count" min="0" step="1" inputmode="numeric" placeholder="예: 6">
                </div>
            </div>
            <div class="vr-row vr-row--3">
                <div class="vr-slot">
                    <label for="vr-company">업체이름</label>
                    <input type="text" id="vr-company" name="vn_company" required maxlength="200" autocomplete="organization" placeholder="업체이름">
                </div>
                <div class="vr-slot">
                    <label for="vr-ceo">대표자 이름</label>
                    <input type="text" id="vr-ceo" name="vn_ceo" maxlength="80" autocomplete="name" placeholder="대표자 이름">
                </div>
                <div class="vr-slot">
                    <label for="vr-ceo-tel">대표자 연락처</label>
                    <input type="tel" id="vr-ceo-tel" name="vn_ceo_tel" maxlength="30" inputmode="tel" placeholder="대표자 연락처">
                </div>
            </div>
            <div class="vr-row vr-row--3">
                <div class="vr-slot">
                    <label for="vr-web">홈페이지</label>
                    <input type="text" id="vr-web" name="vn_web" maxlength="500" inputmode="url" placeholder="https://">
                </div>
                <div class="vr-slot">
                    <label for="vr-email">회사 이메일</label>
                    <input type="email" id="vr-email" name="vn_email" maxlength="120" autocomplete="email" placeholder="회사 이메일">
                </div>
                <div class="vr-slot">
                    <label for="vr-phone">회사 전화</label>
                    <input type="tel" id="vr-phone" name="vn_phone" maxlength="30" inputmode="tel" placeholder="회사 전화">
                </div>
            </div>
            <div class="vr-row vr-row--3">
                <div class="vr-slot">
                    <label for="vr-biz-no">사업자등록번호</label>
                    <input type="text" id="vr-biz-no" name="vn_biz_no" maxlength="20" inputmode="numeric" autocomplete="off" placeholder="000-00-00000">
                </div>
                <div class="vr-slot">
                    <label for="vr-biz-item">업종</label>
                    <input type="text" id="vr-biz-item" name="vn_biz_item" maxlength="120" placeholder="업종">
                </div>
                <div class="vr-slot">
                    <label for="vr-biz-type">업태</label>
                    <input type="text" id="vr-biz-type" name="vn_biz_type" maxlength="120" placeholder="업태">
                </div>
            </div>
            <div class="vr-field vr-field--address" id="vr-address-mount"></div>
            <div class="vr-row vr-row--3">
                <div class="vr-slot">
                    <label for="vr-mgr-name">담당자 이름</label>
                    <input type="text" id="vr-mgr-name" name="vn_mgr_name" maxlength="80" placeholder="담당자 이름">
                </div>
                <div class="vr-slot">
                    <label for="vr-mgr-tel">담당자 연락처</label>
                    <input type="tel" id="vr-mgr-tel" name="vn_mgr_tel" maxlength="30" inputmode="tel" placeholder="담당자 연락처">
                </div>
                <div class="vr-slot">
                    <label for="vr-mgr-email">담당자 이메일</label>
                    <input type="email" id="vr-mgr-email" name="vn_mgr_email" maxlength="120" autocomplete="email" placeholder="담당자 이메일">
                </div>
            </div>
            <div class="vr-field pr-photo-field">
                <span class="pr-photo-label" id="vr-logo-label">회사 로고</span>
                <input type="file" id="vr-logo-gallery" class="pr-photo-file-input" name="vn_logo_gallery" accept="image/*,.heic,.heif">
                <input type="file" id="vr-logo-camera" class="pr-photo-file-input" name="vn_logo_camera" accept="image/*" capture="environment">
                <div class="pr-photo-actions" role="group" aria-labelledby="vr-logo-label">
                    <button type="button" class="pr-photo-btn" id="vr-logo-gallery-btn">앨범·파일에서 선택</button>
                    <button type="button" class="pr-photo-btn pr-photo-btn--camera" id="vr-logo-camera-btn">카메라로 촬영</button>
                </div>
                <p class="vr-hint vr-hint--logo">앨범·촬영 후 1:1 정사각형·1MB 이하로 자동 맞춥니다.</p>
                <img id="vr-logo-preview" class="vr-preview-sm pr-photo-preview tj-image-preview" alt="로고 미리보기" width="96" height="96" hidden>
            </div>
            <div class="vr-field">
                <label for="vr-note">회사 상황</label>
                <textarea id="vr-note" name="vn_note" rows="4" maxlength="8000" placeholder="회사 상황·추가 설명"></textarea>
            </div>
            <div class="vr-actions">
                <button type="submit" class="btn btn-primary" id="vr-submit">저장</button>
                <button type="button" class="btn btn-secondary" id="vr-cancel-edit" hidden>편집 취소</button>
            </div>
        </form>
    </main>
        <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
</div>
    </footer>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                var y = now.getFullYear();
                var m = String(now.getMonth() + 1).padStart(2, "0");
                var d = String(now.getDate()).padStart(2, "0");
                todayEl.dateTime = y + "-" + m + "-" + d;
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            function syncAuthUi() {
                var loggedIn = window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn();
                if (logoutBtn) logoutBtn.hidden = !loggedIn;
            }
            syncAuthUi();
        })();
    </script>
    <script src="vendor-register.js"></script>
</body>
</html>
