<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <title>수기 거래명세서 목록 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="staff-hub.css">
    <link rel="stylesheet" href="order-manage-layout.css">
    <link rel="stylesheet" href="transaction-manual-list.css">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="order-ui.js"></script>
    <script src="auth.js?v=20260530-order-nav"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js?v=20260530-order-nav" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav site-header-nav--order" aria-label="주문서 관리 메뉴"></nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar shub-page om-page">
        <p class="shub-subnav"><a href="order-manage-hub.html">← 주문서 관리</a></p>
        <h1>수기 거래명세서 목록</h1>
        <p id="tml-status" class="shub-status" role="status" aria-live="polite"></p>

        <div class="tml-toolbar">
            <a href="transaction-manual-register.html" class="btn btn-primary">새로 작성</a>
        </div>

        <div class="tml-filter" id="tml-filter-wrap" hidden>
            <div class="tml-filter-row">
                <label for="tml-admin-filter">발행 관리자</label>
                <select id="tml-admin-filter">
                    <option value="">전체 관리자</option>
                </select>
                <button type="button" class="btn btn-primary" id="tml-btn-search">조회</button>
            </div>
        </div>

        <section class="shub-panel">
            <div class="tml-table-wrap">
                <table class="tml-table" aria-label="수기 거래명세서 목록">
                    <thead>
                        <tr>
                            <th>발행일</th>
                            <th>거래처</th>
                            <th>메모</th>
                            <th>공급자</th>
                            <th>품목</th>
                            <th>합계</th>
                            <th class="tml-col-act">작업</th>
                        </tr>
                    </thead>
                    <tbody id="tml-list-body"></tbody>
                </table>
            </div>
            <p id="tml-empty" class="tml-empty" hidden>표시할 수기 거래명세서가 없습니다.</p>
        </section>
    </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <script src="transaction-manual-list.js"></script>

</html>
