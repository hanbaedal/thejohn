<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="auth-storage.js"></script>
    <script src="site-brand-boot.js"></script>
    <meta name="theme-color" content="#0a4d9c">
    <title>관리자 정보 수정 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="admin-manage.css">
    <link rel="stylesheet" href="address-fields.css">
    <link rel="stylesheet" href="staff-manage.css">
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="nav.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-brand">
            <a href="work-hub.html" class="dz-logo dz-logo--compact" aria-label="그룹 마케팅 관리">
                <img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img">
            </a>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main page-main--hide-scrollbar sm-page sm-self-form-page">
        <p class="am-subnav"><a href="work-hub.html">← 그룹 마케팅 관리</a></p>
        <h1>관리자 정보 수정</h1>
        <p id="sm-status" class="sm-status" role="status" aria-live="polite"></p>
        <section class="sm-panel">
            <form id="sm-self-form" class="sm-self-form" novalidate>
                <input type="hidden" id="sm-self-id" name="id">

                <div class="sm-row sm-row--4">
                    <div class="sm-slot">
                        <label for="sm-self-st_company">회사명</label>
                        <input type="text" id="sm-self-st_company" name="st_company" required>
                    </div>
                    <div class="sm-slot">
                        <label for="sm-self-st_ceo">대표자명</label>
                        <input type="text" id="sm-self-st_ceo" name="st_ceo">
                    </div>
                    <div class="sm-slot">
                        <label for="sm-self-loginId">아이디</label>
                        <input type="text" id="sm-self-loginId" name="loginId" autocomplete="username" required minlength="6" maxlength="12" pattern="[a-zA-Z0-9_-]+">
                    </div>
                    <div class="sm-slot">
                        <label for="sm-self-password">비밀번호</label>
                        <input type="text" id="sm-self-password" name="password" autocomplete="new-password" placeholder="비워 두면 유지" spellcheck="false">
                    </div>
                </div>

                <div class="sm-divider" role="separator" aria-hidden="true"></div>
                <div class="sm-gap-2lines" aria-hidden="true"></div>

                <div class="sm-row sm-row--4">
                    <div class="sm-slot">
                        <label for="sm-self-st_phone">회사전화</label>
                        <input type="tel" id="sm-self-st_phone" name="st_phone" autocomplete="tel">
                    </div>
                    <div class="sm-slot">
                        <label for="sm-self-st_fax">회사팩스</label>
                        <input type="tel" id="sm-self-st_fax" name="st_fax" inputmode="tel">
                    </div>
                    <div class="sm-slot">
                        <label for="sm-self-st_email">회사 이메일</label>
                        <input type="email" id="sm-self-st_email" name="st_email" autocomplete="email">
                    </div>
                    <div class="sm-slot">
                        <label for="sm-self-st_ceo_tel">대표연락처</label>
                        <input type="tel" id="sm-self-st_ceo_tel" name="st_ceo_tel">
                    </div>
                </div>

                <div class="sm-row sm-row--4">
                    <div class="sm-slot">
                        <label for="sm-self-st_web">홈페이지</label>
                        <input type="url" id="sm-self-st_web" name="st_web" placeholder="https://">
                    </div>
                    <div class="sm-slot">
                        <label for="sm-self-st_biz_no">사업자등록번호</label>
                        <input type="text" id="sm-self-st_biz_no" name="st_biz_no" inputmode="numeric">
                    </div>
                    <div class="sm-slot">
                        <label for="sm-self-st_biz_item">업종</label>
                        <input type="text" id="sm-self-st_biz_item" name="st_biz_item">
                    </div>
                    <div class="sm-slot">
                        <label for="sm-self-st_biz_type">업태</label>
                        <input type="text" id="sm-self-st_biz_type" name="st_biz_type">
                    </div>
                </div>

                <div class="sm-divider" role="separator" aria-hidden="true"></div>
                <div class="sm-gap-2lines" aria-hidden="true"></div>

                <div class="sm-field sm-field--full" id="sm-self-address-mount"></div>

                <div class="sm-divider" role="separator" aria-hidden="true"></div>
                <div class="sm-gap-2lines" aria-hidden="true"></div>

                <p class="sm-section-label">푸터 SNS (페이스북·인스타·네이버카페·유튜브·카카오)</p>
                <div class="sm-row sm-row--2">
                    <div class="sm-slot">
                        <label for="sm-self-st_facebook">페이스북</label>
                        <input type="url" id="sm-self-st_facebook" name="st_facebook" placeholder="https://">
                    </div>
                    <div class="sm-slot">
                        <label for="sm-self-st_instagram">인스타그램</label>
                        <input type="url" id="sm-self-st_instagram" name="st_instagram" placeholder="https://">
                    </div>
                </div>
                <div class="sm-row sm-row--2">
                    <div class="sm-slot">
                        <label for="sm-self-st_naver_cafe">네이버 카페</label>
                        <input type="url" id="sm-self-st_naver_cafe" name="st_naver_cafe" placeholder="https://">
                    </div>
                    <div class="sm-slot">
                        <label for="sm-self-st_youtube">유튜브</label>
                        <input type="url" id="sm-self-st_youtube" name="st_youtube" placeholder="https://">
                    </div>
                </div>
                <div class="sm-row sm-row--1">
                    <div class="sm-slot sm-slot--full">
                        <label for="sm-self-st_kakao">카카오톡 채널</label>
                        <input type="text" id="sm-self-st_kakao" name="st_kakao" placeholder="https://pf.kakao.com/_채널ID/chat 또는 _채널ID" autocomplete="off">
                    </div>
                </div>

                <div class="sm-divider" role="separator" aria-hidden="true"></div>
                <div class="sm-gap-2lines" aria-hidden="true"></div>

                <div class="sm-brand-media-field">
                    <div class="sm-row sm-row--2 sm-brand-media-row">
                        <div class="sm-slot sm-brand-slot pr-photo-field">
                            <span class="pr-photo-label" id="sm-self-logo-label">회사 로고</span>
                            <div class="sm-brand-controls">
                                <input type="file" id="sm-self-logo-gallery" class="pr-photo-file-input" accept="image/*,.heic,.heif">
                                <input type="file" id="sm-self-logo-camera" class="pr-photo-file-input" accept="image/*" capture="environment">
                                <div class="pr-photo-actions sm-brand-icon-actions" role="group" aria-labelledby="sm-self-logo-label">
                                    <button type="button" class="pr-photo-icon-btn" id="sm-self-logo-gallery-btn" aria-label="앨범·파일에서 선택" title="앨범·파일에서 선택">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                                    </button>
                                    <button type="button" class="pr-photo-icon-btn pr-photo-icon-btn--camera" id="sm-self-logo-camera-btn" aria-label="카메라로 촬영" title="카메라로 촬영">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                    </button>
                                    <button type="button" class="pr-photo-icon-btn pr-photo-icon-btn--clear sm-logo-clear-btn" id="sm-self-logo-clear" hidden aria-label="로고 제거" title="로고 제거">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                                    </button>
                                </div>
                                <img id="sm-self-logo-preview" class="sm-brand-preview sm-brand-preview--logo pr-photo-preview tj-image-preview" alt="로고 미리보기" width="96" height="96" hidden>
                            </div>
                        </div>
                        <div class="sm-slot sm-brand-slot pr-photo-field">
                            <span class="pr-photo-label" id="sm-self-seal-label">회사 도장</span>
                            <div class="sm-brand-controls">
                                <input type="file" id="sm-self-seal-gallery" class="pr-photo-file-input" accept="image/*,.heic,.heif">
                                <input type="file" id="sm-self-seal-camera" class="pr-photo-file-input" accept="image/*" capture="environment">
                                <div class="pr-photo-actions sm-brand-icon-actions" role="group" aria-labelledby="sm-self-seal-label">
                                    <button type="button" class="pr-photo-icon-btn" id="sm-self-seal-gallery-btn" aria-label="앨범·파일에서 선택" title="앨범·파일에서 선택">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                                    </button>
                                    <button type="button" class="pr-photo-icon-btn pr-photo-icon-btn--camera" id="sm-self-seal-camera-btn" aria-label="카메라로 촬영" title="카메라로 촬영">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                    </button>
                                    <button type="button" class="pr-photo-icon-btn pr-photo-icon-btn--clear sm-logo-clear-btn" id="sm-self-seal-clear" hidden aria-label="도장 제거" title="도장 제거">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                                    </button>
                                </div>
                                <img id="sm-self-seal-preview" class="sm-brand-preview sm-brand-preview--seal pr-photo-preview tj-image-preview" alt="도장 미리보기" width="96" height="96" hidden>
                            </div>
                        </div>
                    </div>
                    <div class="sm-row sm-row--2 sm-brand-hints-row">
                        <p class="sm-field-hint sm-brand-hint">로그인 시 사이트 헤더·앱 아이콘으로 표시됩니다. 512×512px로 자동 맞춤 저장됩니다.</p>
                        <p class="sm-field-hint sm-brand-hint">거래명세서 PDF 인감용·투명 PNG 권장.</p>
                    </div>
                </div>

                <div class="sm-field sm-field--full sm-actions">
                    <button type="submit" class="btn btn-primary">저장</button>
                    <a href="work-hub.html" class="btn">취소</a>
                </div>
            </form>
        </section>
    </main>

    <div id="sm-self-save-modal" class="sm-modal sm-self-save-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sm-self-save-title">
        <div class="sm-modal__panel sm-self-save-modal__panel">
            <h2 id="sm-self-save-title" class="sm-modal__title">저장되었습니다!</h2>
            <p class="sm-self-save-modal__lead">로그아웃하시겠습니까?</p>
            <p id="sm-self-save-hint" class="sm-self-save-modal__hint" hidden></p>
            <div class="sm-self-save-modal__actions">
                <button type="button" class="btn btn-primary" id="sm-self-save-logout">로그아웃</button>
                <button type="button" class="btn" id="sm-self-save-continue">그룹 마케팅 관리로</button>
            </div>
        </div>
    </div>

    <script src="product-form-shared.js"></script>
    <script src="address-fields.js"></script>
    <script src="staff-self-edit.js"></script>
    <script>
        (function () {
            var todayEl = document.getElementById("headerToday");
            if (todayEl) {
                var now = new Date();
                todayEl.dateTime = now.toISOString().slice(0, 10);
                todayEl.textContent = now.toLocaleDateString("ko-KR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                });
            }
            var logoutBtn = document.getElementById("btnLogout");
            if (logoutBtn) {
                logoutBtn.hidden = !(window.THEJHON_AUTH && THEJHON_AUTH.isLoggedIn());
            }
        })();
    </script>
</body>
</html>
