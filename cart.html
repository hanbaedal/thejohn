    <link rel="stylesheet" href="common.css">
    <style>
        .cart-title { margin: 0 0 0.5rem; font-size: 1.35rem; color: #052a4d; }
        .cart-page-hint {
            margin: 0 0 1.25rem;
            padding: 0.65rem 0.85rem;
            background: #f4f8fc;
            border: 1px solid #d4e2f0;
            border-radius: 8px;
            font-size: 0.88rem;
            color: #3d556d;
            line-height: 1.5;
        }
        .cart-empty { color: #3d5166; line-height: 1.55; }
        .cart-empty a { color: var(--dz-blue); font-weight: 600; }
        .cart-history-list { list-style: none; margin: 0; padding: 0; }
        .cart-history-item {
            padding: 0.75rem 1rem;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: #fff;
            cursor: pointer;
        }
        .cart-history-item.is-selected {
            border-color: var(--dz-blue, #0a4d9c);
            box-shadow: 0 0 0 2px rgba(10, 77, 156, 0.12);
        }
        .cart-history-name { display: block; font-weight: 700; color: #052a4d; }
        .cart-history-meta { font-size: 0.85rem; color: #5a6d7e; }
        #cart-history-detail {
            margin-top: 1rem;
            padding: 1rem;
            background: #f8fafc;
            border: 1px solid #d4e2f0;
            border-radius: 12px;
        }
        #cart-history-detail[hidden] { display: none !important; }
        #cart-history-status { margin: 0 0 0.75rem; font-size: 0.88rem; color: #3d5166; }
        .order-detail-meta {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.3rem 1rem;
            margin: 0 0 1rem;
            font-size: 0.92rem;
        }
        .order-detail-meta dt { font-weight: 700; color: #2a4a5e; margin: 0; }
        .order-detail-meta dd { margin: 0; }
        .order-detail-table-wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
        }
        .order-detail-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        .order-detail-table th,
        .order-detail-table td {
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid #e8edf2;
            text-align: left;
        }
        .order-detail-table th { background: #f4f7fb; }
        .order-detail-total { margin: 0.75rem 0 0; text-align: right; font-size: 1rem; }
        .cart-actions-row { margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    </style>
