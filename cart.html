<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="public-site-config.js?v=20260620"></script>
    <script src="auth-storage.js?v=20260620-public"></script>
    <script src="site-brand-boot.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a4d9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="더존">
    <title>주문서 보기 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .cart-title { margin: 0 0 0.5rem; font-size: 1.35rem; color: #052a4d; }
        .cart-empty { color: #3d5166; line-height: 1.55; }
        .cart-empty a { color: var(--dz-blue); font-weight: 600; }
        .cart-history-list { list-style: none; margin: 0; padding: 0; }
        .cart-history-item {
            padding: 0.75rem 1rem;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: #fff;
            cursor: pointer;
        }
        .cart-history-item.is-selected {
            border-color: var(--dz-blue, #0a4d9c);
            box-shadow: 0 0 0 2px rgba(10, 77, 156, 0.12);
        }
        .cart-history-name { display: block; font-weight: 700; color: #052a4d; }
        .cart-history-meta { font-size: 0.85rem; color: #5a6d7e; }
        /* 주문 상세 — 화면 중앙 모달 (PC·스마트폰 공통) */
        .cart-detail-modal {
            position: fixed;
            inset: 0;
            z-index: 10050;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
            box-sizing: border-box;
            background: rgba(5, 42, 77, 0.45);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .cart-detail-modal.is-open {
            display: flex !important;
        }
        .cart-detail-modal[hidden] {
            display: none !important;
        }
        body.cart-detail-modal-open {
            overflow: hidden;
        }
        .cart-history-detail-panel {
            width: min(100%, 40rem);
            max-height: min(92vh, 44rem);
            max-height: min(92dvh, 44rem);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f8fafc;
            border: 1px solid #d4e2f0;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(10, 77, 156, 0.22);
        }
        .cart-detail-layout {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .cart-detail-meta-wrap {
            flex-shrink: 0;
        }
        .cart-detail-meta-wrap .order-detail-meta {
            margin-bottom: 0.5rem;
        }
        .cart-detail-items-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 0;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            background: #fff;
        }
        .cart-detail-items-scroll .order-detail-table-wrap {
            border: none;
            border-radius: 0;
            margin: 0;
        }
        .cart-detail-foot {
            flex-shrink: 0;
        }
        .cart-detail-foot .order-detail-total {
            margin-top: 0;
            margin-bottom: 0.45rem;
        }
        #cart-history-status { margin: 0 0 0.75rem; font-size: 0.88rem; color: #3d5166; }
        .order-detail-meta {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.3rem 1rem;
            margin: 0 0 1rem;
            font-size: 0.92rem;
        }
        .order-detail-meta dt { font-weight: 700; color: #2a4a5e; margin: 0; }
        .order-detail-meta dd { margin: 0; }
        .order-detail-table-wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
        }
        .cart-history-detail-panel .order-detail-table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
            font-size: 0.88rem;
            table-layout: fixed;
            display: table !important;
        }
        .cart-history-detail-panel .order-detail-table thead {
            display: table-header-group !important;
        }
        .cart-history-detail-panel .order-detail-table tbody {
            display: table-row-group !important;
        }
        .cart-history-detail-panel .order-detail-table tr {
            display: table-row !important;
        }
        .cart-history-detail-panel .order-detail-table th,
        .cart-history-detail-panel .order-detail-table td {
            display: table-cell !important;
            padding: 0.5rem 0.35rem;
            border-bottom: 1px solid #e8edf2;
            text-align: left;
            vertical-align: middle;
        }
        .order-detail-table th {
            background: #f4f7fb;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
        }
        .cart-history-detail-panel .order-detail-table th:nth-child(1),
        .cart-history-detail-panel .order-detail-table td:nth-child(1) {
            text-align: center;
            width: 7%;
        }
        .cart-history-detail-panel .order-detail-table th:nth-child(2),
        .cart-history-detail-panel .order-detail-table td:nth-child(2) {
            width: 26%;
            white-space: normal;
            word-break: keep-all;
            overflow-wrap: break-word;
        }
        .cart-history-detail-panel .order-detail-table th:nth-child(3),
        .cart-history-detail-panel .order-detail-table td:nth-child(3) {
            width: 12%;
            text-align: center;
            white-space: nowrap;
        }
        .cart-history-detail-panel .order-detail-table th:nth-child(4),
        .cart-history-detail-panel .order-detail-table td:nth-child(4) {
            width: 22%;
            text-align: right;
            white-space: nowrap;
        }
        .cart-history-detail-panel .order-detail-table th:nth-child(5),
        .cart-history-detail-panel .order-detail-table td:nth-child(5) {
            width: 10%;
            text-align: center;
            white-space: nowrap;
        }
        .cart-history-detail-panel .order-detail-table th:nth-child(6),
        .cart-history-detail-panel .order-detail-table td:nth-child(6) {
            width: 18%;
            text-align: right;
            white-space: nowrap;
        }
        .order-detail-total { margin: 0.75rem 0 0; text-align: right; font-size: 1rem; }
        .order-admin-splits {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }
        .order-admin-split {
            padding: 0.65rem 0.7rem;
            border: 1px solid #d8e4ef;
            border-radius: 10px;
            background: #fafcff;
        }
        .order-admin-split__title {
            margin: 0 0 0.35rem;
            font-size: 0.92rem;
            font-weight: 700;
            color: #052a4d;
        }
        .order-admin-split__meta {
            margin: 0 0 0.45rem;
            font-size: 0.78rem;
            color: #5a6d7e;
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem 0.75rem;
        }
        .order-admin-split__no {
            font-weight: 600;
            color: #2a4a5e;
        }
        .order-admin-split__total {
            margin: 0.45rem 0 0;
            text-align: right;
            font-size: 0.88rem;
            color: #052a4d;
        }
        .cart-actions-row { margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .cart-detail-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            flex-shrink: 0;
            padding: 0.75rem 0.85rem 0.4rem;
            margin-bottom: 0;
        }
        .cart-detail-title {
            margin: 0;
            font-size: 1.05rem;
            color: #052a4d;
        }
        .cart-detail-modal__close {
            flex-shrink: 0;
            border: none;
            background: transparent;
            font-size: 1.6rem;
            line-height: 1;
            color: #5a6d7e;
            cursor: pointer;
            padding: 0.2rem 0.45rem;
            min-width: 40px;
            min-height: 40px;
        }
        .cart-detail-modal__close:hover {
            color: #052a4d;
        }
        .cart-history-detail-panel .cart-detail-layout {
            flex: 1 1 auto;
            min-height: 0;
            padding: 0 0.85rem;
        }
        .cart-history-detail-panel .cart-detail-foot {
            flex-shrink: 0;
            padding: 0.4rem 0.85rem;
            padding-bottom: max(0.65rem, env(safe-area-inset-bottom, 0));
            background: #f8fafc;
            border-top: 1px solid #e8edf2;
        }
        @media (max-width: 720px) {
            .cart-detail-modal {
                padding: 0.35rem;
            }
            .cart-history-detail-panel {
                width: 100%;
                max-height: min(94vh, 44rem);
                max-height: min(94dvh, 44rem);
            }
            .cart-detail-title {
                font-size: 0.88rem;
            }
            .cart-history-detail-panel .order-detail-meta {
                font-size: 0.7rem;
                gap: 0.1rem 0.4rem;
                margin-bottom: 0.4rem;
            }
            .cart-history-detail-panel .order-detail-table {
                font-size: 0.62rem;
            }
            .cart-history-detail-panel .order-detail-table th,
            .cart-history-detail-panel .order-detail-table td {
                padding: 0.3rem 0.15rem;
                line-height: 1.25;
            }
            .cart-history-detail-panel .order-detail-table th {
                font-size: 0.6rem;
            }
            .cart-history-detail-panel .order-detail-table small {
                font-size: 0.58rem;
            }
            .cart-history-detail-panel .order-detail-total {
                font-size: 0.82rem;
            }
            .cart-history-detail-panel .cart-actions-row .btn {
                min-height: 32px;
                padding: 0.3rem 0.5rem;
                font-size: 0.72rem;
            }
        }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="order-ui.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
    <script src="cart.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <a href="index.html" class="dz-logo dz-logo--compact" aria-label="더존 홈"><img src="img/logo.png" alt="" width="72" height="72" class="dz-logo-img"></a>
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <div class="nav-dropdown" data-nav-dropdown="support">
                    <a href="support.html" class="header-nav-link nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="supportSubmenu">고객센터</a>
                    <div id="supportSubmenu" class="nav-dropdown-panel" role="menu" aria-label="고객센터 하위 메뉴">
                        <a href="support-partners.html" class="nav-dropdown-item" role="menuitem">파트너회사 소개</a>
                        <a href="support-library.html" class="nav-dropdown-item" role="menuitem">최근소식</a>
                        <a href="support-qna.html" class="nav-dropdown-item" role="menuitem">자유게시판</a>
                        <a href="support-inquiry.html" class="nav-dropdown-item" role="menuitem">문의사항</a>
                    </div>
                </div>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main">
        <h1 class="cart-title">주문서 보기</h1>
        <p id="cart-history-status" role="status" aria-live="polite"></p>
        <div id="cart-access-msg" aria-live="polite"></div>
        <div id="cart-history-list"></div>
    </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <dl class="site-footer-grid" id="siteFooterCompanyGrid" aria-live="polite"></dl>
            <p class="site-footer-company-msg" id="siteFooterCompanyMsg" hidden></p>
        </div>
    </footer>
    <div
        id="cart-history-detail-modal"
        class="cart-detail-modal"
        hidden
        role="dialog"
        aria-modal="true"
        aria-labelledby="cart-detail-title"
    >
        <div id="cart-history-detail" class="cart-history-detail-panel" aria-live="polite"></div>
    </div>
</body>
</html>
