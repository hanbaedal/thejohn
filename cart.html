<!DOCTYPE html>

<head>

    <title>장바구니 · 주문 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .cart-title { margin: 0 0 1rem; font-size: 1.35rem; color: #052a4d; }
        .cart-empty { color: #3d5166; line-height: 1.55; }
        .cart-empty a { color: var(--dz-blue); font-weight: 600; }
        .cart-table-wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 12px;
            box-shadow: 0 2px 14px rgba(10, 77, 156, 0.08);
        }
        .cart-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        .cart-table th, .cart-table td {
            padding: 0.65rem 0.75rem;
            border-bottom: 1px solid #e8edf2;
            text-align: left;
        }
        .cart-table th { background: #f4f7fb; font-weight: 700; color: #2a4a5e; }
        .cart-qty {
            width: 4rem;
            padding: 0.35rem 0.5rem;
            border: 1px solid #c5d0dc;
            border-radius: 6px;
        }
        .cart-actions-row { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
        .cart-total {
            margin-left: auto;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dz-blue);
        }
        .cart-note {
            width: 100%;
            max-width: 32rem;
            margin-top: 1rem;
            padding: 0.5rem 0.65rem;
            border: 1px solid #c5d0dc;
            border-radius: 8px;
            font-family: inherit;
        }
        .cart-msg { margin: 1rem 0 0; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.92rem; }
        .cart-msg--ok { background: #e8f5e9; color: #1b5e20; }
        .cart-msg--warn { background: #fff8e1; color: #6d4c00; }
        .cart-msg--err { background: #ffebee; color: #b71c1c; }
        .btn-remove { color: #c62828; background: transparent; border: none; cursor: pointer; font-size: 0.88rem; }
    </style>
    <script src="api-config.js"></script>

    <script src="order-pdf-client.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
    <script src="cart.js" defer></script>
</head>
