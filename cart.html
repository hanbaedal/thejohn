<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문서 내역 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .cart-title { margin: 0 0 1rem; font-size: 1.35rem; color: #052a4d; }
        .cart-empty { color: #3d5166; line-height: 1.55; }
        .cart-empty a { color: var(--dz-blue); font-weight: 600; }
        .cart-table-wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 12px;
            box-shadow: 0 2px 14px rgba(10, 77, 156, 0.08);
        }
        .cart-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        .cart-table th, .cart-table td {
            padding: 0.65rem 0.75rem;
            border-bottom: 1px solid #e8edf2;
            text-align: left;
        }
        .cart-table th { background: #f4f7fb; font-weight: 700; color: #2a4a5e; }
        .cart-qty {
            width: 4rem;
            padding: 0.35rem 0.5rem;
            border: 1px solid #c5d0dc;
            border-radius: 6px;
        }
        .cart-actions-row { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
        .cart-total {
            margin-left: auto;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dz-blue);
        }
        .cart-note {
            width: 100%;
            max-width: 32rem;
            margin-top: 1rem;
            padding: 0.5rem 0.65rem;
            border: 1px solid #c5d0dc;
            border-radius: 8px;
            font-family: inherit;
        }
        .cart-msg { margin: 1rem 0 0; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.92rem; }
        .cart-msg--ok { background: #e8f5e9; color: #1b5e20; }
        .cart-msg--warn { background: #fff8e1; color: #6d4c00; }
        .cart-msg--err { background: #ffebee; color: #b71c1c; }
        .btn-remove { color: #c62828; background: transparent; border: none; cursor: pointer; font-size: 0.88rem; }
        .cart-contact-confirm {
            margin-top: 1.25rem;
            padding: 1rem 1.1rem;
            background: #f4f8fc;
            border: 1px solid #c5d8eb;
            border-radius: 12px;
        }
        .cart-contact-title { margin: 0 0 0.35rem; font-size: 1.05rem; color: #052a4d; }
        .cart-contact-desc { margin: 0 0 0.75rem; font-size: 0.9rem; color: #3d5166; line-height: 1.5; }
        .cart-contact-dl {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.35rem 1rem;
            margin: 0 0 0.85rem;
            font-size: 0.95rem;
        }
        .cart-contact-dl dt { font-weight: 700; color: #2a4a5e; margin: 0; }
        .cart-contact-dl dd { margin: 0; color: #1a2a3a; }
        .cart-contact-check {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.92rem;
            line-height: 1.45;
            cursor: pointer;
        }
        .cart-contact-check input { margin-top: 0.2rem; flex-shrink: 0; }
        .cart-contact-warn {
            margin: 0.5rem 0 0;
            font-size: 0.88rem;
            color: #b71c1c;
        }
        .cart-order-footer .site-footer-grid { max-width: 40rem; }
        #btnSubmitOrder:disabled { opacity: 0.55; cursor: not-allowed; }
        .cart-section { margin-top: 2rem; }
        .cart-section-title {
            margin: 0 0 0.75rem;
            font-size: 1.15rem;
            color: #052a4d;
            padding-bottom: 0.35rem;
            border-bottom: 2px solid #d4e2f0;
        }
        .cart-history-list { list-style: none; margin: 0; padding: 0; }
        .cart-history-item {
            padding: 0.75rem 1rem;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: #fff;
            cursor: pointer;
        }
        .cart-history-item.is-selected {
            border-color: var(--dz-blue, #0a4d9c);
            box-shadow: 0 0 0 2px rgba(10, 77, 156, 0.12);
        }
        .cart-history-name { display: block; font-weight: 700; color: #052a4d; }
        .cart-history-meta { font-size: 0.85rem; color: #5a6d7e; }
        #cart-history-detail {
            margin-top: 1rem;
            padding: 1rem;
            background: #f8fafc;
            border: 1px solid #d4e2f0;
            border-radius: 12px;
        }
        #cart-history-detail[hidden] { display: none !important; }
        .order-detail-meta {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.3rem 1rem;
            margin: 0 0 1rem;
            font-size: 0.92rem;
        }
        .order-detail-meta dt { font-weight: 700; color: #2a4a5e; margin: 0; }
        .order-detail-meta dd { margin: 0; }
        .order-detail-table-wrap {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
        }
        .order-detail-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        .order-detail-table th,
        .order-detail-table td {
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid #e8edf2;
            text-align: left;
        }
        .order-detail-table th { background: #f4f7fb; }
        .order-detail-total { margin: 0.75rem 0 0; text-align: right; font-size: 1rem; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="vendor-cart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="order-ui.js"></script>
    <script src="order-pdf-client.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
    <script src="cart.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <div class="nav-dropdown" data-nav-dropdown="support">
                    <a href="support.html" class="header-nav-link nav-dropdown-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="supportSubmenu">고객센터</a>
                    <div id="supportSubmenu" class="nav-dropdown-panel" role="menu" aria-label="고객센터 하위 메뉴">
                        <a href="support-partners.html" class="nav-dropdown-item" role="menuitem">파트너회사 소개</a>
                        <a href="support-library.html" class="nav-dropdown-item" role="menuitem">최근소식</a>
                        <a href="support-qna.html" class="nav-dropdown-item" role="menuitem">자유게시판</a>
                        <a href="support-inquiry.html" class="nav-dropdown-item" role="menuitem">문의사항</a>
                    </div>
                </div>
                <span class="header-nav-link is-static" title="준비 중입니다">카페</span>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main">
        <h1 class="cart-title">주문서 내역</h1>
        <div id="cart-root" aria-live="polite"></div>
        <section class="cart-section" id="cart-history-section" aria-labelledby="cart-history-title">
            <h2 class="cart-section-title" id="cart-history-title">접수된 주문</h2>
            <p id="cart-history-status" class="cart-contact-desc" role="status"></p>
            <div id="cart-history-list"></div>
            <div id="cart-history-detail" hidden aria-live="polite"></div>
        </section>
    </main>
    <footer class="site-footer cart-order-footer" id="cartOrderFooter" hidden aria-label="주문 담당자">
        <div class="site-footer-inner">
            <dl class="site-footer-grid">
                <div class="site-footer-item"><dt>주문 업체</dt><dd id="footerVendorCompany">—</dd></div>
                <div class="site-footer-item"><dt>주문 담당</dt><dd id="footerVendorMgrName">—</dd></div>
                <div class="site-footer-item"><dt>연락처</dt><dd id="footerVendorMgrTel">—</dd></div>
            </dl>
        </div>
    </footer>
</body>
</html>
