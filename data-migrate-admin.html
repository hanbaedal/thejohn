<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB 형식 변환 — 더존</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .dm-main { max-width: 720px; margin: 0 auto; }
        .dm-lead { color: #3d5166; line-height: 1.55; margin: 0 0 1rem; }
        .dm-box {
            background: #fff;
            border: 1px solid #e0e6ed;
            border-radius: 10px;
            padding: 1rem 1.1rem;
            margin-bottom: 1rem;
        }
        .dm-pre {
            margin: 0.5rem 0 0;
            padding: 0.75rem;
            background: #f4f6f9;
            border-radius: 8px;
            font-size: 0.8rem;
            overflow: auto;
            max-height: 280px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .dm-status { margin: 0.75rem 0 0; font-size: 0.9rem; color: #3d5166; }
        .dm-status.is-err { color: #a12c2c; }
        .dm-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    </style>
    <script src="api-config.js"></script>
    <script src="thejhon-api.js"></script>
    <script src="auth.js"></script>
    <script src="admin-header.js"></script>
    <script src="nav.js" defer></script>
    <script src="data-migrate-admin.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-start">
            <nav class="site-header-nav" aria-label="주요 메뉴">
                <a href="company.html" class="header-nav-link">회사소개</a>
                <a href="products.html" class="header-nav-link">사업부문</a>
                <a href="product-register.html" class="header-nav-link">상품등록</a>
                <a href="vendor-register.html" class="header-nav-link">업체등록</a>
                <a href="vendor-manage.html" class="header-nav-link">업체관리</a>
            </nav>
        </div>
        <nav class="site-header-actions" aria-label="계정">
            <time class="header-date" id="headerToday" datetime=""></time>
            <button type="button" class="btn btn-auth-icon btn-logout" id="btnLogout" hidden aria-label="로그아웃" title="로그아웃"></button>
        </nav>
    </header>
    <main class="page-main dm-main">
        <h1>DB 형식 변환</h1>
        <p class="dm-lead">
            MongoDB <strong>products</strong>·<strong>vendors</strong>·<strong>staff</strong> 에 저장된
            예전 필드(title, livestock, companyName 등)를 현재 프로그램 형식(pd_*, vn_*)으로 맞춥니다.
            <strong>총괄 관리자 thejohn</strong>만 실행할 수 있습니다.
        </p>
        <div class="dm-box">
            <h2 style="margin:0 0 0.5rem;font-size:1rem;">변환 전 현황</h2>
            <pre class="dm-pre" id="dm-preview">불러오는 중…</pre>
        </div>
        <div class="dm-box">
            <p style="margin:0;">실행 시 모든 상품·업체 레코드를 읽어 새 형식으로 다시 저장합니다. (사진·내용은 유지)</p>
            <div class="dm-actions">
                <button type="button" class="btn btn-primary" id="dm-run">DB 형식 변환 실행</button>
                <button type="button" class="btn" id="dm-refresh">현황 새로고침</button>
                <a href="vendor-manage.html" class="btn">업체관리로</a>
            </div>
            <p class="dm-status" id="dm-status" role="status"></p>
            <pre class="dm-pre" id="dm-result" hidden></pre>
        </div>
    </main>
</body>
</html>
